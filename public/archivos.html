<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archivos — lepayimio.es</title>
<link rel="icon" href="/img/archivos-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/archivos-180.png">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1f3b">
<link rel="stylesheet" href="/css/comun.css">
<style>
/* El color de esta sección: gris azulado, como su icono. */
:root { --tinte-1: #3a4560; --tinte-2: #4a5568; }
  .herramientas {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }
  .herramientas .separa { flex: 1; }

  .lista { display: grid; gap: 0.5rem; }

  .fila {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.7rem 0.9rem;
    background: var(--cristal);
    border: 1px solid var(--cristal-borde);
    border-radius: 0.9rem;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
  }
  .fila:hover { background: rgba(255, 255, 255, 0.19); }

  .sello {
    display: grid;
    place-items: center;
    width: 2.6rem;
    height: 2.6rem;
    flex: none;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 0.6rem;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .sello.carpeta { background: rgba(255, 214, 10, 0.22); font-size: 1.15rem; }
  .sello img { width: 100%; height: 100%; object-fit: cover; }

  .fila-cuerpo { flex: 1; min-width: 0; cursor: pointer; text-align: left; }
  .fila-nombre { font-size: 0.92rem; font-weight: 550; overflow-wrap: anywhere; }
  .fila-datos { color: var(--texto-suave); font-size: 0.78rem; }
  .fila-acciones { display: flex; gap: 0.35rem; flex: none; }

  @media (max-width: 34rem) {
    .fila { flex-wrap: wrap; }
    .fila-acciones { width: 100%; justify-content: flex-end; }
  }

  /* ── Visor ──────────────────────────────────────────────────────────────── */

  .visor {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    grid-template-rows: auto 1fr;
    background: rgba(10, 12, 24, 0.97);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .visor-cab {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    padding-top: max(0.85rem, env(safe-area-inset-top));
    border-bottom: 1px solid var(--cristal-borde);
  }
  .visor-nombre { flex: 1; min-width: 0; font-size: 0.92rem; font-weight: 600; overflow-wrap: anywhere; }
  .visor-cuerpo { display: grid; place-items: center; overflow: auto; padding: 1rem; }
  .visor-cuerpo img, .visor-cuerpo video { max-width: 100%; max-height: 100%; border-radius: 0.5rem; }
  .visor-cuerpo iframe { width: 100%; height: 100%; border: 0; background: #fff; border-radius: 0.5rem; }
  .visor-cuerpo pre {
    width: 100%;
    max-width: 56rem;
    align-self: start;
    margin: 0;
    padding: 1.25rem;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 0.6rem;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.82rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .sin-visor { max-width: 30rem; text-align: center; }
  .sin-visor p { color: var(--texto-suave); margin-bottom: 1.25rem; }
</style>
<!-- Antes que el guion de la pagina, que lo usa para pintar cada ficha. -->
<script src="/js/iconos.js"></script>
<!-- Antes que el guion de la pagina, que engancha su boton. -->
<script src="/js/seleccion.js"></script>
<script src="/js/arrastrar.js"></script>
</head>
<body>

<div class="envoltorio">

  <nav class="barra">
    <h1 class="titulo-con-icono">
      <img class="titulo-icono" src="/img/archivos-180.png" alt="" width="44" height="44">
      Archivos
      </h1>
  </nav>



  <div id="recado" class="recado" hidden></div>
  <div class="migas" id="migas"></div>

  <div class="herramientas">
    <button class="boton principal" id="nueva" type="button">Nueva carpeta</button>
    <button class="boton" id="seleccionar" type="button" aria-pressed="false">Seleccionar</button>
    <span class="separa"></span>
    <span class="fila-datos" id="cuenta"></span>
  </div>

  <div class="rejilla-docs" id="lista"></div>
  <p class="nada" id="vacio" hidden>Esta carpeta está vacía.</p>

</div>

<div class="visor" id="visor" hidden>
  <div class="visor-cab">
    <div class="visor-nombre" id="v-nombre"></div>
    <button class="mini" id="v-compartir" type="button">Compartir</button>
    <a class="mini" id="v-descargar" download>Descargar</a>
    <button class="mini" id="v-cerrar" type="button">Cerrar</button>
  </div>
  <div class="visor-cuerpo" id="v-cuerpo"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var aqui = '';

  function avisar(t, clase) {
    var r = $('recado');
    r.textContent = t;
    r.className = 'recado' + (clase ? ' ' + clase : '');
    r.hidden = !t;
    if (t && clase === 'bueno') setTimeout(function () { r.hidden = true; }, 5000);
  }

  async function api(ruta, opciones) {
    var res = await fetch(ruta, Object.assign({ credentials: 'same-origin' }, opciones || {}));
    var d = null;
    try { d = await res.json(); } catch (e) {}
    if (!res.ok) { var e2 = new Error((d && d.error) || ('Error ' + res.status)); e2.datos = d; throw e2; }
    return d;
  }

  var verUrl = function (rel, descarga) {
    return '/api/f/archivos/ver?f=' + encodeURIComponent(rel) + (descarga ? '&descarga=1' : '');
  };


  var EDITABLE = /\.(txt|md|csv|log|json|xml|ya?ml|ini|conf|docx|xlsx|odt|ods)$/i;

  function fila(x) {
    var caja = document.createElement('div');
    caja.className = 'doc';
    /* Lo único que el arrastre necesita saber de cada cosa. */
    caja.dataset.rel = x.rel;
    caja.dataset.nombre = x.nombre;
    caja.dataset.carpeta = x.tipo === 'carpeta' ? '1' : '0';

    var b = document.createElement('button');
    b.className = 'doc-abrir';
    b.type = 'button';
    b.title = x.nombre;

    var s = document.createElement('div');
    s.className = 'doc-icono';
    if (x.tipo === 'carpeta') {
      s.innerHTML = ICONOS.carpeta();
    } else if (x.clase === 'imagen') {
      /* Las imágenes se ven mejor con su miniatura que con las letras de su
         extensión: aquí el contenido sí distingue una de otra. */
      var mini = document.createElement('img');
      mini.className = 'doc-mini';
      mini.src = '/api/f/archivos/mini?f=' + encodeURIComponent(x.rel);
      mini.alt = '';
      mini.loading = 'lazy';
      mini.onerror = function () { s.innerHTML = ICONOS.de(ICONOS.clase(x.ext), x.ext); };
      s.appendChild(mini);
    } else {
      s.innerHTML = ICONOS.de(ICONOS.clase(x.ext), x.ext);
    }

    var n = document.createElement('div');
    n.className = 'doc-nombre';
    /* Recortado, con el entero al dejar el cursor encima. */
    n.textContent = ICONOS.nombreCorto(x.nombre);
    n.title = x.nombre;

    var d = document.createElement('div');
    d.className = 'doc-datos';
    d.textContent = x.tipo === 'carpeta'
      ? (x.cuantos + (x.cuantos === 1 ? ' elemento' : ' elementos'))
      : x.tamanoTexto;

    b.appendChild(s);
    b.appendChild(n);
    b.appendChild(d);
    b.onclick = function () {
      if (x.tipo === 'carpeta') cargar(x.rel);
      else abrir(x);
    };
    caja.appendChild(b);

    /* Las acciones, detrás de un botón: puestas debajo de cada tarjeta
       convertirían la rejilla en una maraña de botones diminutos. */
    var acciones = document.createElement('div');
    acciones.className = 'doc-acciones';
    var mas = document.createElement('button');
    mas.type = 'button';
    mas.className = 'doc-mas';
    mas.textContent = '\u00b7\u00b7\u00b7';
    mas.title = 'Acciones';
    mas.setAttribute('aria-label', 'Acciones de ' + x.nombre);
    mas.setAttribute('aria-haspopup', 'menu');
    mas.onclick = function (e) { e.stopPropagation(); menuAcciones(x, mas); };
    acciones.appendChild(mas);
    caja.appendChild(acciones);

    return caja;
  }

  /* ── El menú de acciones ───────────────────────────────────────────────
     Se crea al abrirlo y se tira al cerrarlo, en vez de dejar uno colgando de
     cada tarjeta: en una carpeta con doscientos ficheros eso son doscientos
     menús ocultos. Va pegado al <body> y no dentro de la tarjeta para que no
     lo recorte la rejilla ni se lo lleve el clon al arrastrar. */

  var menuAbierto = null;

  function cerrarMenu() {
    if (menuAbierto && menuAbierto.parentNode) menuAbierto.parentNode.removeChild(menuAbierto);
    menuAbierto = null;
  }

  function menuAcciones(x, ancla) {
    var mismo = menuAbierto && menuAbierto.dueno === ancla;
    cerrarMenu();
    if (mismo) return;   // volver a pulsar lo cierra

    var m = document.createElement('div');
    m.className = 'menu-acciones';
    m.setAttribute('role', 'menu');
    m.dueno = ancla;
    m.onclick = function (e) { e.stopPropagation(); };

    function opcion(texto, clase, alPulsar) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = texto;
      if (clase) b.className = clase;
      b.onclick = function () { cerrarMenu(); alPulsar(); };
      m.appendChild(b);
    }

    if (x.tipo !== 'carpeta') {
      /* El editor solo para lo que sabe editar. Ofrecerlo en un .zip y que
         luego diga que no puede es peor que no ofrecerlo. */
      if (EDITABLE.test(x.nombre)) {
        opcion('Editar', '', function () {
          location.href = '/editar?tipo=archivos&f=' + encodeURIComponent(x.rel);
        });
      }
      opcion('Compartir', '', function () { Compartir.abrir('archivos', x); });

      var a = document.createElement('a');
      a.href = verUrl(x.rel, true);
      a.download = '';
      a.textContent = 'Bajar';
      a.onclick = function () { cerrarMenu(); };
      m.appendChild(a);
    }
    opcion('Renombrar', '', function () { renombrar(x); });
    opcion('Eliminar', 'peligro', function () { borrar(x); });

    document.body.appendChild(m);

    /* Se coloca junto al botón, y se mete para dentro si se saldría por abajo
       o por la derecha. */
    var c = ancla.getBoundingClientRect();
    var suya = m.getBoundingClientRect();
    var izq = Math.max(8, Math.min(c.left, window.innerWidth - suya.width - 8));
    var arr = c.bottom + 6;
    if (arr + suya.height > window.innerHeight - 8) {
      arr = Math.max(8, c.top - suya.height - 6);
    }
    m.style.left = izq + 'px';
    m.style.top = arr + 'px';
    menuAbierto = m;
  }

  document.addEventListener('click', cerrarMenu);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarMenu(); });
  /* Si la página se mueve, el menú se quedaría flotando lejos de su botón. */
  window.addEventListener('scroll', cerrarMenu, true);
  window.addEventListener('resize', cerrarMenu);

  function pintarMigas(datos) {
    var m = $('migas');
    m.textContent = '';
    var raiz = document.createElement('a');
    raiz.href = '#';
    raiz.textContent = 'Archivos';
    raiz.dataset.rel = '';
    raiz.onclick = function (e) { e.preventDefault(); cargar(''); };
    m.appendChild(raiz);

    datos.migas.forEach(function (x, i) {
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '/';
      m.appendChild(sep);
      if (i === datos.migas.length - 1) {
        var fin = document.createElement('span');
        fin.className = 'fin';
        fin.textContent = x.nombre;
        m.appendChild(fin);
      } else {
        var a = document.createElement('a');
        a.href = '#';
        a.textContent = x.nombre;
        a.onclick = function (e) { e.preventDefault(); cargar(x.rel); };
        m.appendChild(a);
      }
    });
  }

  /* El boton solo enciende y apaga; lo que se puede hacer con lo marcado sale
     en la barra de abajo, que es de js/seleccion.js. */
  var botonSeleccionar = $('seleccionar');
  if (botonSeleccionar && window.SELECCION) {
    botonSeleccionar.addEventListener('click', function () {
      var encendida = window.SELECCION.activa();
      if (encendida) window.SELECCION.apagar();
      else window.SELECCION.encender();
      botonSeleccionar.setAttribute('aria-pressed', encendida ? 'false' : 'true');
      botonSeleccionar.classList.toggle('activo', !encendida);
    });
  }


  async function cargar(rel) {
    try {
      var d = await api('/api/f/archivos?en=' + encodeURIComponent(rel || ''));
      aqui = d.rel;
      pintarMigas(d);
      var l = $('lista');
      l.textContent = '';
      d.carpetas.forEach(function (x) { l.appendChild(fila(x)); });
      d.ficheros.forEach(function (x) { l.appendChild(fila(x)); });
      $('vacio').hidden = d.total > 0;

    /* Se monta al terminar de pintar: las filas son nuevas cada vez. */
    if (window.ARRASTRAR) {
      var recargar = function (bien, mal) {
        if (mal) avisar(mal, 'malo');
        else if (bien) avisar(bien, 'bien');
        cargar(aqui);
      };
      window.ARRASTRAR.montar({
        tipo: 'archivos', contenedor: 'lista', elemento: '.doc',
        carpeta: aqui, horizontal: true, recargar: recargar,
      });
      window.ARRASTRAR.montarMigas({ tipo: 'archivos', migas: 'migas', recargar: recargar });
    }

    /* Lo mismo para la seleccion: las fichas son nuevas cada vez y lo marcado
       tiene que volver a pintarse encima. */
    if (window.SELECCION) {
      window.SELECCION.montar({
        tipo: 'archivos', contenedor: 'lista', elemento: '.doc',
        recargar: function (bien, mal) {
          if (mal) avisar(mal, 'malo');
          else if (bien) avisar(bien, 'bien');
          cargar(aqui);
        },
      });
    }
      $('cuenta').textContent = d.total
        ? d.carpetas.length + ' carpetas · ' + d.ficheros.length + ' ficheros' : '';
    } catch (err) { avisar(err.message, 'malo'); }
  }

  // ── Acciones ──────────────────────────────────────────────────────────────


  $('nueva').onclick = async function () {
    var nombre = prompt('Nombre de la carpeta nueva:');
    if (!nombre) return;
    try {
      await api('/api/f/archivos/carpeta', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ en: aqui, nombre: nombre }),
      });
      avisar('Carpeta creada.', 'bueno');
      cargar(aqui);
    } catch (err) { avisar(err.message, 'malo'); }
  };

  async function renombrar(x) {
    var nombre = prompt('Nombre nuevo:', x.nombre);
    if (!nombre || nombre === x.nombre) return;
    try {
      await api('/api/f/archivos/renombrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ f: x.rel, nombre: nombre }),
      });
      cargar(aqui);
    } catch (err) { avisar(err.message, 'malo'); }
  }

  async function borrar(x) {
    var texto = x.tipo === 'carpeta'
      ? 'Se borra la carpeta «' + x.nombre + '».'
      : 'Se borra del disco «' + x.nombre + '» (' + x.tamanoTexto + ').\n\nNo hay vuelta atrás.';
    if (!confirm(texto)) return;
    try {
      await api('/api/f/archivos?f=' + encodeURIComponent(x.rel), { method: 'DELETE' });
      cargar(aqui);
      avisar('Eliminado.', 'bueno');
    } catch (err) {
      /* Una carpeta con cosas dentro no se va de un clic: se dice cuántas hay y
         se pregunta otra vez. Borrar en cascada por descuido no tiene vuelta. */
      if (err.datos && err.datos.cuantos) {
        if (!confirm('«' + x.nombre + '» tiene ' + err.datos.cuantos + ' cosas dentro.'
                   + '\n\n¿Borrarla con todo lo que hay?')) return;
        try {
          await api('/api/f/archivos?f=' + encodeURIComponent(x.rel) + '&contodo=1',
                    { method: 'DELETE' });
          cargar(aqui);
          avisar('Carpeta eliminada con su contenido.', 'bueno');
        } catch (e2) { avisar(e2.message, 'malo'); }
      } else {
        avisar(err.message, 'malo');
        /* Si el servidor dice que eso ya no existe, la que va atrasada es la
           pantalla: se recarga para que deje de ensenar algo que no esta. */
        cargar(aqui);
      }
    }
  }

  // ── Visor ─────────────────────────────────────────────────────────────────

  function cerrar() {
    $('visor').hidden = true;
    $('v-cuerpo').textContent = '';       // corta el vídeo si estaba sonando
    document.body.style.overflow = '';
  }
  $('v-cerrar').onclick = cerrar;
  $('v-compartir').onclick = function () {
    if (abierto) Compartir.abrir('archivos', abierto);
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('visor').hidden) cerrar();
  });

  var abierto = null;

  async function abrir(x) {
    abierto = x;
    $('v-nombre').textContent = x.nombre;
    $('v-descargar').href = verUrl(x.rel, true);
    $('visor').hidden = false;
    document.body.style.overflow = 'hidden';
    var c = $('v-cuerpo');
    c.textContent = '';

    if (x.clase === 'imagen') {
      var img = document.createElement('img');
      img.src = '/api/f/archivos/grande?f=' + encodeURIComponent(x.rel);
      img.alt = x.nombre;
      img.onerror = function () { c.textContent = ''; c.appendChild(sinVisor('No he podido abrir la imagen.', x)); };
      c.appendChild(img);

    } else if (x.clase === 'video' || x.clase === 'audio') {
      var v = document.createElement('video');
      v.src = verUrl(x.rel);
      v.controls = true;
      v.preload = 'metadata';
      if (x.clase === 'audio') v.style.width = 'min(100%, 34rem)';
      c.appendChild(v);

    } else if (x.clase === 'pdf') {
      var marco = document.createElement('iframe');
      marco.src = verUrl(x.rel);
      marco.title = x.nombre;
      c.appendChild(marco);

    } else if (x.clase === 'texto') {
      c.textContent = 'Abriendo…';
      try {
        var res = await fetch(verUrl(x.rel), { credentials: 'same-origin' });
        var t = await res.text();
        c.textContent = '';
        var pre = document.createElement('pre');
        /* Se corta a 400 kB: un log de cien megas no se lee en una pantalla y
           mete al navegador en un atasco del que no sale. */
        pre.textContent = t.length > 400000
          ? t.slice(0, 400000) + '\n\n… (cortado: el fichero es más grande, descárgalo para verlo entero)'
          : t;
        c.appendChild(pre);
      } catch (err) { c.textContent = ''; c.appendChild(sinVisor('No he podido leerlo.', x)); }

    } else {
      c.appendChild(sinVisor('No hay forma de enseñar un .' + (x.ext || '?') + ' en el navegador.', x));
    }
  }

  function sinVisor(mensaje, x) {
    var d = document.createElement('div');
    d.className = 'sin-visor';
    var p = document.createElement('p');
    p.textContent = mensaje;
    var a = document.createElement('a');
    a.className = 'boton principal';
    a.href = verUrl(x.rel, true);
    a.download = '';
    a.textContent = 'Descargar ' + x.nombre;
    d.appendChild(p);
    d.appendChild(a);
    return d;
  }

  cargar('');
})();
</script>

<script src="/js/compartir.js"></script>
<script src="/js/espacio.js"></script>
<script src="/js/ajustes.js"></script>
</body>
</html>
