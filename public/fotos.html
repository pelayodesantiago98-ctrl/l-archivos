<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galería — lepayimio.es</title>
<link rel="icon" href="/img/galeria-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/galeria-180.png">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1f3b">
<link rel="stylesheet" href="/css/comun.css?v=1787223337">
<!-- La capa de acabado: va DESPUES de la hoja de la casa, que es lo que le
     permite anadir sin redefinir. -->
<link rel="stylesheet" href="/css/mejoras.css?v=1787399315">
<style>
/* El color de esta sección: carmín, como su icono. */
:root { --tinte-1: #8f2f52; --tinte-2: #c2436b; }

/*
 * Galería, al modo de Fotos de iCloud: cuadrados a hueso de borde a borde,
 * agrupados por fecha con la cabecera pegada arriba mientras pasas su tramo, y
 * el visor a pantalla completa por encima de todo.
 *
 * El acento sigue siendo el carmín de la casa y no el azul de iOS. Cada sección
 * de l-archivos tiene su color y es así como se sabe dónde estás sin leer el
 * título; copiar el azul de Apple sería parecerse más a Fotos y menos a esto.
 */

/* Cuántas columnas. Se declara aquí arriba porque lo usan la rejilla y el
   relleno de la cabecera, y tenerlo en un sitio evita que se desincronicen. */
:root {
  --columnas: 3;
  --hueco: 2px;

  /* Lo que .envoltorio deja de respiro a los lados. La rejilla lo deshace con
     un margen negativo para llegar al borde, así que si allí cambia, aquí
     también: son el mismo número escrito una vez. */
  --sangria: 1.4rem;

  /* El vidrio de la cabecera pegada.
     Aquí no hay un color de fondo plano al que agarrarse —lo pinta un degradado
     en body::before— así que se parte de --fondo-2, que es el panel opaco de la
     casa, y se deja translúcido para que las fotos se vean pasar por debajo. */
  --galeria-vidrio: color-mix(in srgb, var(--fondo-2, #1b2030) 55%, transparent);
  --galeria-vidrio-borde: color-mix(in srgb, var(--fondo-2, #1b2030) 40%, transparent);
}
@media (min-width: 30rem)  { :root { --columnas: 4; } }
@media (min-width: 48rem)  { :root { --columnas: 5; } }
@media (min-width: 64rem)  { :root { --columnas: 6; } }
@media (min-width: 80rem)  { :root { --columnas: 8; } }

/* ── La rejilla ───────────────────────────────────────────────────────────
 *
 * Número FIJO de columnas, no `auto-fill` con un mínimo.
 *
 * Antes era `repeat(auto-fill, minmax(11rem, 1fr))`, y eso obliga a elegir
 * entre dos defectos: con `auto-fill`, tres fotos ocupan tres huecos de 11rem y
 * dejan el resto de la fila vacío —que es lo que pasaba, media pantalla en
 * blanco—; con `auto-fit` esas tres se estiran hasta llenar la fila y salen
 * gigantes.
 *
 * Fotos no hace ninguna de las dos: fija cuántas caben por fila según el ancho
 * de la pantalla, y entonces tres fotos son tres cuadrados pequeños en una fila
 * que empieza en el borde. No sobra hueco porque no hay hueco que sobrar: la
 * fila mide lo que mide la pantalla.
 */
.rejilla {
  display: grid;
  grid-template-columns: repeat(var(--columnas), 1fr);
  gap: var(--hueco);

  /* A hueso con los bordes. La galería es la pantalla entera, no una tarjeta
     dentro de ella: el margen negativo deshace el respiro de .envoltorio. */
  margin-inline: calc(-1 * var(--sangria, 1.4rem));
}

/* Los cuadrados van sin redondear, y es lo que más hace que esto se lea como
   Fotos. Con 2px de separación y las esquinas vivas, la rejilla se ve como una
   sola superficie cortada; en cuanto se redondean, se ve como una bandeja de
   pegatinas. */
.celda {
  position: relative;
  aspect-ratio: 1;
  background: rgba(255, 255, 255, 0.06);
  border: 0;
  border-radius: 0;
  padding: 0;
  overflow: hidden;
  cursor: pointer;
}

/*
 * Por qué estas reglas llevan #galeria delante.
 *
 * Una celda es un <button>, y la capa de acabado compartida da a los botones de
 * todo el dominio su transición y su hundido con `button:not([class*="ejs_"])`.
 * Eso pesa más que `.celda` a secas, así que sin el id ganaba ella: medido, la
 * celda salía con los seis tiempos del botón genérico (120/120/240...) y no con
 * el suyo, y el hundido era el 0,97 de la casa en vez del 0,96 de aquí.
 *
 * No es un fallo de esa capa: una foto de la rejilla no es un botón normal
 * aunque esté hecha con la etiqueta de un botón. Aquí la galería dice que
 * dentro de su rejilla manda ella, y lo dice del modo más corto que hay.
 */

/* El hundido al pulsar tiene que verse ENTERO aunque la foto ocupe la celda
   hasta el borde, así que se hunde la celda y no la imagen. */
#galeria .celda {
  transition: transform 120ms cubic-bezier(0.22, 1, 0.36, 1);
}

/*
 * El hundido responde al dedo, no al clic.
 *
 * `:active` en un <button> entra en cuanto el puntero baja, no al soltar, que
 * es la mitad de lo que hace que algo se sienta directo: si la respuesta espera
 * al `click`, llega tarde y ya no parece que la hayas tocado tú.
 */
#galeria .celda:active { transform: scale(0.96); }

.celda img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 0.25s, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.celda img.puesta { opacity: 1; }

/* ── Crecer en el sitio al pasar el ratón ──────────────────────────────────
 *
 * Antes esto abría una copia flotando al lado. Dos imágenes de lo mismo a la
 * vez es una de más: hay que mirar cuál es cuál, y la copia tapa a unas vecinas
 * con las que no tiene nada que ver. Ahora crece la de verdad, donde está, y
 * las demás se quedan quietas.
 *
 * Se escala la CELDA y no la imagen de dentro. La celda recorta con
 * `overflow: hidden`, así que escalar solo la imagen enseñaría más recorte y no
 * más foto. Escalando la celda crece el cuadro entero con lo que lleve dentro
 * —y eso es lo que hace que valga igual para un vídeo.
 *
 * Solo con ratón. En una pantalla táctil no existe «estar encima sin pulsar»:
 * el dedo o toca o no toca, y esto saltaría en cada intento de abrir una foto.
 */
@media (hover: hover) and (pointer: fine) {
  #galeria .celda {
    transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 260ms cubic-bezier(0.22, 1, 0.36, 1),
                border-radius 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  #galeria .celda:hover {
    transform: scale(1.6);
    z-index: 10;
    /* Al crecer tiene que despegarse del resto, o no se lee como una foto
       levantada por encima sino como una rota dentro de la rejilla. */
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
    /* El canto vivo funciona a tamaño de miniatura; a casi el doble se ve duro,
       así que se redondea solo mientras está crecida. */
    border-radius: 8px;

    /* Crecer espera un pelín; encogerse, no.
       Sin la espera, cruzar la rejilla para llegar a otro sitio va levantando
       cuadros por el camino. Al salir tiene que responder en el acto: lo que
       decide el usuario puede tomarse su tiempo, la respuesta del sistema no. */
    transition-delay: 140ms;
  }

  /* Los de los bordes crecen HACIA DENTRO. Uno de la primera columna, escalando
     desde su centro, se sale por la izquierda y se queda medio cortado; el de la
     última, por la derecha. Los números repiten el recuento de columnas de más
     arriba porque nth-child no sabe leer una variable — si allí cambian, aquí
     también. */
  #galeria .celda:nth-child(3n + 1):hover { transform-origin: left center; }
  #galeria .celda:nth-child(3n):hover     { transform-origin: right center; }
}
@media (hover: hover) and (pointer: fine) and (min-width: 30rem) {
  #galeria .celda:nth-child(3n + 1):hover,
  #galeria .celda:nth-child(3n):hover     { transform-origin: center; }
  #galeria .celda:nth-child(4n + 1):hover { transform-origin: left center; }
  #galeria .celda:nth-child(4n):hover     { transform-origin: right center; }
}
@media (hover: hover) and (pointer: fine) and (min-width: 48rem) {
  #galeria .celda:nth-child(4n + 1):hover,
  #galeria .celda:nth-child(4n):hover     { transform-origin: center; }
  #galeria .celda:nth-child(5n + 1):hover { transform-origin: left center; }
  #galeria .celda:nth-child(5n):hover     { transform-origin: right center; }
}
@media (hover: hover) and (pointer: fine) and (min-width: 64rem) {
  #galeria .celda:nth-child(5n + 1):hover,
  #galeria .celda:nth-child(5n):hover     { transform-origin: center; }
  #galeria .celda:nth-child(6n + 1):hover { transform-origin: left center; }
  #galeria .celda:nth-child(6n):hover     { transform-origin: right center; }
}
@media (hover: hover) and (pointer: fine) and (min-width: 80rem) {
  #galeria .celda:nth-child(6n + 1):hover,
  #galeria .celda:nth-child(6n):hover     { transform-origin: center; }
  #galeria .celda:nth-child(8n + 1):hover { transform-origin: left center; }
  #galeria .celda:nth-child(8n):hover     { transform-origin: right center; }
}

/* El vídeo, reproduciéndose dentro de su propio cuadro por encima de su
   fotograma. Va sin puntero para que el clic siga siendo el de la celda: si se
   lo quedara él, abrir el visor dejaría de funcionar justo encima del vídeo. */
.celda-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 200ms ease;
  pointer-events: none;
}
.celda-video.puesto { opacity: 1; }

.celda .rota {
  display: grid;
  place-items: center;
  height: 100%;
  padding: 0.4rem;
  color: var(--texto-suave);
  font-size: 0.62rem;
  text-align: center;
  overflow-wrap: anywhere;
}

/* ── La cabecera de cada día ──────────────────────────────────────────────
 *
 * Se queda pegada arriba mientras pasas su tramo y la empuja la del día
 * siguiente. Es lo que hace que no te pierdas al bajar por un año de fotos:
 * siempre sabes de qué día es lo que estás viendo sin tener que subir.
 *
 * Funciona porque la cabecera y su rejilla son hermanas dentro de #galeria y
 * ningún antepasado tiene `overflow`. Si algún día se le pone a .envoltorio,
 * esto deja de pegarse sin avisar de nada.
 */
.grupo-fecha {
  position: sticky;
  top: 0;
  z-index: 3;

  margin: 1.6rem 0 0.5rem;
  padding: 0.5rem var(--sangria, 1.4rem) 0.55rem;
  margin-inline: calc(-1 * var(--sangria, 1.4rem));

  font-size: 1.05rem;
  font-weight: 650;
  /* Un pelín de tracking negativo: a este tamaño y en semibold, las letras se
     ven separadas de más si se deja a cero. */
  letter-spacing: -0.015em;
  line-height: 1.2;

  /* Cristal, para que las fotos se vean pasar por debajo en vez de chocar
     contra una banda opaca. */
  background: var(--galeria-vidrio);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
}

/* Ni raya ni sombra debajo: se difumina el borde inferior con una máscara. Una
   línea de 1px marca una frontera dura donde no la hay — lo que hay es una capa
   flotando sobre otra, y eso se dice desvaneciendo, no dibujando. */
.grupo-fecha::after {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 100%;
  height: 0.75rem;
  background: linear-gradient(
    to bottom,
    var(--galeria-vidrio-borde),
    transparent);
  pointer-events: none;
}

.grupo-fecha span {
  color: var(--texto-suave);
  font-weight: 400;
  font-size: 0.8rem;
  letter-spacing: 0;
}

/* ── Los filtros, como un control segmentado ──────────────────────────────
 *
 * Antes eran tres pastillas sueltas con borde. Un control segmentado dice otra
 * cosa: que son UNA elección de tres, excluyentes, y no tres interruptores que
 * podrían estar encendidos a la vez.
 *
 * El pulgar se mueve solo, sin una línea de JavaScript: `:has()` mira cuál de
 * los tres botones lleva la clase `on` y coloca el pseudoelemento en su tercio.
 * Que se deslice entre posiciones en vez de saltar es lo que convierte el
 * cambio en un movimiento y no en un parpadeo.
 */
.filtros {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.7rem;
  margin: 0 0 1rem;
}

.filtro-grupo {
  position: relative;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 0;
  padding: 2px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  isolation: isolate;
}

.filtro-grupo::before {
  content: "";
  position: absolute;
  z-index: -1;
  top: 2px;
  bottom: 2px;
  left: 2px;
  width: calc((100% - 4px) / 3);
  border-radius: 999px;
  background: var(--tinte-2, #c2436b);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
}
.filtro-grupo:has(.filtro:nth-child(2).on)::before { transform: translateX(100%); }
.filtro-grupo:has(.filtro:nth-child(3).on)::before { transform: translateX(200%); }

.filtro {
  position: relative;
  border: 0;
  background: transparent;
  color: var(--texto-suave);
  font: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  padding: 0.35rem 0.95rem;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 160ms ease;
}
.filtro.on { color: #fff; font-weight: 600; }

@media (hover: hover) and (pointer: fine) {
  .filtro:not(.on):hover { color: var(--texto); }
}

.filtro-fecha { display: flex; align-items: center; gap: .4rem; font-size: .85rem; opacity: .85; }
.filtro-fecha select {
  font: inherit;
  font-size: .85rem;
  padding: .3rem .6rem;
  border-radius: 999px;
  border: 1px solid var(--linea, rgba(255,255,255,.14));
  background: rgba(255,255,255,.06);
  color: inherit;
}

/* El distintivo de vídeo sobre su fotograma. */
.es-video {
  position: absolute;
  right: .35rem;
  bottom: .35rem;
  width: 1.4rem;
  height: 1.4rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, .5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: #fff;
  font-size: .65rem;
  line-height: 1;
  pointer-events: none;
}

/* ── Visor ────────────────────────────────────────────────────────────────── */

.visor {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: rgba(0, 0, 0, 0.96);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.visor-cab {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.8rem 1rem;
  padding-top: max(0.8rem, env(safe-area-inset-top));
}
.visor-cab > div:first-child {
  flex: 1;
  min-width: 0;
}
.visor-nombre {
  min-width: 0;
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.visor-datos { color: var(--texto-suave); font-size: 0.78rem; }

.visor-cuerpo {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 0;
  /* Red de seguridad: si algo vuelve a crecer de más, se recorta aquí en vez de
     irse por encima de los botones. */
  overflow: hidden;
  padding: 0 0.5rem;
}
.visor-cuerpo img {
  /*
   * Alto y ancho al 100% con scale-down, en vez de max-width/max-height.
   *
   * Con max-height: 100% la imagen se salía por abajo y tapaba los botones:
   * en un contenedor grid cuya altura la resuelve un "1fr", ese porcentaje se
   * queda indefinido en el momento del cálculo y el navegador acaba aplicando
   * solo el ancho. Medido: una foto de 1600x1200 se pintaba a 1068 px de alto
   * dentro de un hueco de 713, o sea 231 px por debajo del borde.
   *
   * Dándole la caja entera y dejando que object-fit decida, el tamaño ya no
   * depende de resolver ningún porcentaje. scale-down y no contain para que una
   * foto pequeña no se amplíe hasta verse pastosa: se queda a su tamaño.
   */
  width: 100%;
  height: 100%;
  object-fit: scale-down;
  /* La foto llega en dos pasos: primero la miniatura, que ya está en caché y
     aparece al instante, y encima la grande cuando termina de bajar. Sin esto
     se queda un hueco negro en cada pase. */
  transition: opacity 0.2s;
}
.visor-cuerpo .cargando {
  position: absolute;
  color: var(--texto-suave);
  font-size: 0.85rem;
}

/* Las flechas: cristal redondo, como los controles que Fotos pone encima de la
   imagen. Se apagan del todo cuando no hay a dónde ir, en vez de quedarse
   pulsables sin efecto. */
.flecha {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: grid;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  color: var(--texto);
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 50%;
  font-size: 1.2rem;
  cursor: pointer;
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  transition: background-color 160ms ease, transform 140ms cubic-bezier(0.22, 1, 0.36, 1);
}
@media (hover: hover) and (pointer: fine) {
  .flecha:not(:disabled):hover { background: rgba(255, 255, 255, 0.2); }
}
.flecha:not(:disabled):active { transform: translateY(-50%) scale(0.92); }
.flecha.izq { left: 0.6rem; }
.flecha.der { right: 0.6rem; }
.flecha:disabled { opacity: 0.2; cursor: default; }

.visor-pie {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
  padding: 0.9rem 1rem;
  padding-bottom: max(0.9rem, env(safe-area-inset-bottom));
}

/*
 * La tira de abajo.
 *
 * La actual es más ancha que las demás y va a plena opacidad; las vecinas se
 * quedan atenuadas y estrechas. Es lo que hace Fotos, y no es adorno: dice de
 * un vistazo dónde estás dentro del carrete sin tener que contar.
 */
.tira {
  display: flex;
  align-items: center;
  justify-content: safe center;
  gap: 3px;
  overflow-x: auto;
  padding: 0 1rem 0.6rem;
  scrollbar-width: none;
  scroll-behavior: smooth;
}
.tira::-webkit-scrollbar { display: none; }
.tira img {
  width: 2.6rem;
  height: 2.6rem;
  object-fit: cover;
  border-radius: 5px;
  opacity: 0.4;
  cursor: pointer;
  flex: none;
  transition: width 220ms cubic-bezier(0.22, 1, 0.36, 1),
              height 220ms cubic-bezier(0.22, 1, 0.36, 1),
              opacity 220ms ease;
}
@media (hover: hover) and (pointer: fine) {
  .tira img:hover { opacity: 0.75; }
}
.tira img.actual {
  width: 3.4rem;
  height: 3.4rem;
  opacity: 1;
  border-radius: 7px;
  outline: 2px solid #fff;
  outline-offset: -2px;
}

#v-video { max-width: 100%; max-height: 80vh; border-radius: 10px; background: #000; }

/* ── Preferencias del sistema ─────────────────────────────────────────────
 *
 * Menos movimiento no es ningún movimiento: lo que sobra son los
 * desplazamientos y los cambios de tamaño, no el color ni la opacidad, que son
 * los que informan. Se quedan el hundido al pulsar —convertido en un cambio de
 * brillo, que dice lo mismo sin mover nada— y el paso del pulgar de los
 * filtros, que sin él sería un salto.
 */
@media (prefers-reduced-motion: reduce) {
  #galeria .celda, .celda img, .tira img, .flecha { transition: none; }
  #galeria .celda:active { transform: none; filter: brightness(0.82); }
  #galeria .celda:hover { transform: none; box-shadow: none; border-radius: 0; }
  #galeria .celda:hover img { transform: none; filter: brightness(1.12); }
  .filtro-grupo::before { transition: none; }
  .tira { scroll-behavior: auto; }
}

/* Quien pide menos transparencias no quiere cristal: quiere saber dónde acaba
   una capa y empieza la otra. Se sube el fondo y se quita el desenfoque, que
   es caro y ya no pinta nada. */
@media (prefers-reduced-transparency: reduce) {
  .grupo-fecha {
    background: var(--fondo-2, #1b2030);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .grupo-fecha::after { display: none; }
  .flecha, .es-video {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .flecha { background: rgba(60, 60, 70, 0.95); }
}

/* Y con más contraste, bordes definidos donde antes solo había un cambio de
   tono. */
@media (prefers-contrast: more) {
  .filtro-grupo { background: rgba(255, 255, 255, 0.16); }
  .filtro:not(.on) { color: var(--texto); }
  .flecha { border-color: #fff; }
  .tira img:not(.actual) { opacity: 0.7; }
}
</style>
<!-- Antes que el guion de la pagina, que lo monta al pintar. -->
<script src="/js/arrastrar.js"></script>
<script src="/js/seleccion.js"></script>
</head>
<body>

<div class="envoltorio">

  <nav class="barra">
    <h1 class="titulo-con-icono">
      <img class="titulo-icono" src="/img/fotos-180.png" alt="" width="44" height="44">
      Galería
      </h1>
  </nav>

  <p class="entradilla" id="resumen">…</p>

  <div id="recado" class="recado" hidden></div>

  <div class="filtros" id="filtros" hidden>
    <div class="filtro-grupo" role="group" aria-label="Qué enseñar">
      <button type="button" class="filtro on" data-clase="todo">Todo</button>
      <button type="button" class="filtro" data-clase="foto">Fotos</button>
      <button type="button" class="filtro" data-clase="video">Vídeos</button>
    </div>
    <label class="filtro-fecha">
      <span>Cuándo</span>
      <select id="periodo"><option value="">Cualquier fecha</option></select>
    </label>
    <button type="button" class="boton" id="seleccionar" aria-pressed="false">Seleccionar</button>
  </div>

  <div id="galeria"></div>
  <p class="nada" id="vacio" hidden>
    Todavía no hay fotos. Súbelas desde <a href="/" style="color:inherit">Archivos</a>
    eligiendo «imagen».
  </p>

</div>

<div class="visor" id="visor" hidden>
  <div class="visor-cab">
    <div>
      <div class="visor-nombre" id="v-nombre"></div>
      <div class="visor-datos" id="v-datos"></div>
    </div>
    <button class="mini" id="v-cerrar" type="button">Cerrar</button>
  </div>

  <div class="visor-cuerpo" id="v-cuerpo">
    <button class="flecha izq" id="v-antes" type="button" aria-label="Anterior">‹</button>
    <video id="v-video" controls playsinline hidden></video>
    <img id="v-img" alt="">
    <span class="cargando" id="v-cargando" hidden>cargando…</span>
    <button class="flecha der" id="v-luego" type="button" aria-label="Siguiente">›</button>
  </div>

  <div>
    <div class="tira" id="v-tira"></div>
    <div class="visor-pie">
      <button class="boton principal" id="v-compartir" type="button">Compartir</button>
      <a class="boton" id="v-descargar" download>Descargar original</a>
      <button class="boton" id="v-borrar" type="button">Eliminar</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var fotos = [];
  var actual = -1;

  function avisar(t, clase) {
    var r = $('recado');
    r.textContent = t;
    r.className = 'recado' + (clase ? ' ' + clase : '');
    r.hidden = !t;
    if (t && clase === 'bueno') setTimeout(function () { r.hidden = true; }, 5000);
  }

  async function api(ruta, opciones) {
    var res = await fetch(ruta, Object.assign({ credentials: 'same-origin' }, opciones || {}));
    var d = null;
    try { d = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((d && d.error) || ('Error ' + res.status));
    return d;
  }

  /* Cada cosa dice de qué sección sale: las fotos viven en `fotos` y los
     vídeos en `videos`, y son dos carpetas distintas en disco. */
  var url = {
    mini: function (f) { return '/api/f/' + f.seccion + '/mini?f=' + encodeURIComponent(f.rel); },
    grande: function (f) { return '/api/f/' + f.seccion + '/grande?f=' + encodeURIComponent(f.rel); },
    ver: function (f) { return '/api/f/' + f.seccion + '/ver?f=' + encodeURIComponent(f.rel); },
    original: function (f) { return '/api/f/' + f.seccion + '/ver?f=' + encodeURIComponent(f.rel) + '&descarga=1'; },
  };

  /* Agrupar por día, como la galería del teléfono: el montón sin cortes no se
     puede recorrer, y la fecha es lo único que todo el mundo recuerda de una
     foto. */
  /* El dia de una fecha, como numero comparable. */
  function claveDia(ms) {
    var d = new Date(ms);
    return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate();
  }

  /* El servidor manda primero lo que se ha colocado a mano y despues el resto.
     La galeria se enseña por dias, asi que aqui se ordena por dia —del mas
     nuevo al mas viejo— conservando dentro de cada uno el orden que traia.
     Sin esto, una foto recien subida saldria la ultima de toda la galeria en
     vez de con las de su fecha: el orden guardado todavia no la conoce. */
  function porDia(lista) {
    var sitio = new Map();
    lista.forEach(function (f, i) { sitio.set(f.rel, i); });
    return lista.slice().sort(function (a, b) {
      var da = claveDia(a.fecha), db = claveDia(b.fecha);
      if (da !== db) return db - da;
      return sitio.get(a.rel) - sitio.get(b.rel);
    });
  }

  /* La lista entera con lo que se ve recolocado. Con un filtro puesto, en
     pantalla solo hay una parte: guardar solo esa mandaria el resto al final.
     Lo que esta oculto se queda donde estaba. */
  function ordenCompleto(visibles) {
    var enPantalla = {};
    visibles.forEach(function (n) { enPantalla[n] = true; });
    var i = 0;
    return todo.map(function (f) {
      return enPantalla[f.nombre] ? visibles[i++] : f.nombre;
    });
  }

  /* Tras colocar, la lista de memoria tiene que quedar como el DOM: los
     numeros con los que el visor pasa de una foto a otra salen de ella. */
  function alOrdenar() {
    var visibles = [];
    Array.prototype.forEach.call(document.querySelectorAll('#galeria .celda'),
      function (n) { visibles.push(n.dataset.nombre); });

    var porNombre = {};
    todo.forEach(function (f) { porNombre[f.nombre] = f; });
    todo = ordenCompleto(visibles).map(function (n) { return porNombre[n]; })
      .filter(Boolean);
    aplicarFiltros();
  }

  function agrupar(lista) {
    var grupos = [];
    var ultimo = null;
    lista.forEach(function (f) {
      var d = new Date(f.fecha);
      var clave = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      if (!ultimo || ultimo.clave !== clave) {
        ultimo = { clave: clave, fecha: d, fotos: [] };
        grupos.push(ultimo);
      }
      ultimo.fotos.push(f);
    });
    return grupos;
  }

  function titulo(d) {
    var hoy = new Date();
    var ayer = new Date(hoy.getTime() - 86400000);
    var mismo = function (a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()
          && a.getDate() === b.getDate();
    };
    if (mismo(d, hoy)) return 'Hoy';
    if (mismo(d, ayer)) return 'Ayer';
    var opciones = { day: 'numeric', month: 'long' };
    if (d.getFullYear() !== hoy.getFullYear()) opciones.year = 'numeric';
    return d.toLocaleDateString('es-ES', opciones);
  }

  /* Las miniaturas se piden solo cuando la celda se acerca a la pantalla. Con
     doscientas fotos, pedirlas todas de golpe son doscientas peticiones y
     doscientas conversiones en el servidor, para ver doce. */
  var vigia = new IntersectionObserver(function (entradas) {
    entradas.forEach(function (e) {
      if (!e.isIntersecting) return;
      var img = e.target;
      vigia.unobserve(img);
      img.src = img.dataset.src;
    });
  }, { rootMargin: '300px' });

  function celda(f, indice) {
    var video = null, reproducir = null, parar = null;
    var b = document.createElement('button');
    b.className = 'celda';
    b.type = 'button';
    b.title = f.nombre;
    /* Lo que el arrastre necesita saber. El día va aquí porque es lo que
       decide dónde se puede soltar, y calcularlo al vuelo en cada movimiento
       del puntero seria hacerlo cientos de veces por gesto. */
    b.dataset.rel = f.rel;
    /* Fotos y videos son una sola pantalla pero dos carpetas: sin esto,
       borrar o mover un video pregunta por el en la carpeta de fotos. */
    b.dataset.seccion = f.seccion;
    b.dataset.nombre = f.nombre;
    b.dataset.carpeta = '0';
    b.dataset.dia = String(claveDia(f.fecha));
    b.onclick = function () { abrir(indice); };

    var img = document.createElement('img');
    img.alt = f.nombre;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.dataset.src = url.mini(f);
    img.onload = function () { img.classList.add('puesta'); };
    img.onerror = function () {
      /* Una foto que libvips no sabe abrir no puede llevarse por delante la
         rejilla entera: se queda su hueco con el nombre. */
      b.textContent = '';
      var d = document.createElement('div');
      d.className = 'rota';
      d.textContent = f.nombre;
      b.appendChild(d);
    };
    /*
     * Al pasar el ratón se pide la imagen GRANDE y se pone en su sitio.
     *
     * El crecimiento en sí lo hace el CSS solo, pero ampliar una miniatura al
     * doble la deja pastosa: lo que se ve al acercarse tiene que traer más
     * detalle, no el mismo estirado. La miniatura se queda puesta hasta que la
     * grande termina de bajar, así que no hay parpadeo ni hueco.
     *
     * Se pide una sola vez por foto: `pedida` marca que ya se encargó.
     */
    var pedida = false;
    if (conRaton) {
      b.addEventListener('mouseenter', function () {
        if (!pedida && f.clase !== 'video') {
          pedida = true;
          var grande = new Image();
          grande.onload = function () { img.src = grande.src; };
          grande.src = url.grande(f);
        }
        if (video) reproducir();
      });
      b.addEventListener('mouseleave', function () { if (video) parar(); });
    }

    b.appendChild(img);

    /* Un vídeo se tiene que reconocer antes de pulsarlo: su miniatura es un
       fotograma y sin esto parece una foto más. */
    if (f.clase === 'video') {
      var marca = document.createElement('span');
      marca.className = 'es-video';
      marca.setAttribute('aria-hidden', 'true');
      marca.textContent = '▶';
      b.appendChild(marca);
      b.title = f.nombre + ' (vídeo)';

      /*
       * Y con el ratón encima, se reproduce.
       *
       * En silencio y en bucle: un vídeo que arranca con sonido solo por pasar
       * por encima es una emboscada, y además los navegadores no dejan
       * reproducir solo si no está callado.
       *
       * `preload="none"` y el src puesto al entrar: sin eso, una carpeta con
       * veinte vídeos se bajaría entera nada más pintarse la rejilla. Al salir
       * se quita el src, que pausar no corta la descarga.
       *
       * Nada de esto pasa con movimiento reducido: quien lo pide no quiere que
       * algo se ponga a moverse solo por pasar el ratón por encima.
       */
      if (conRaton && !menosMovimiento.matches) {
        video = document.createElement('video');
        video.className = 'celda-video';
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = 'none';
        video.setAttribute('aria-hidden', 'true');
        b.appendChild(video);

        reproducir = function () {
          if (!video.src) video.src = url.ver(f);
          video.classList.add('puesto');
          /* play() devuelve una promesa que se rechaza si te vas antes de que
             empiece. Es lo normal aquí y no hay nada que hacer al respecto. */
          var p = video.play();
          if (p && p.catch) p.catch(function () {});
        };
        parar = function () {
          video.classList.remove('puesto');
          video.pause();
          video.removeAttribute('src');
          video.load();
        };
      }
    }

    vigia.observe(img);
    return b;
  }

  // El vistazo flotante ya no existe: ahora crece la propia foto en su sitio,
  // y de eso se encarga el CSS. Aquí solo queda saber si hay ratón de verdad.
  var conRaton = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var menosMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)');

  var botonSeleccionar = $('seleccionar');
  if (botonSeleccionar && window.SELECCION) {
    botonSeleccionar.addEventListener('click', function () {
      var encendida = window.SELECCION.activa();
      if (encendida) window.SELECCION.apagar();
      else window.SELECCION.encender();
      botonSeleccionar.setAttribute('aria-pressed', encendida ? 'false' : 'true');
      botonSeleccionar.classList.toggle('activo', !encendida);
    });
  }


  function pintar() {
    var g = $('galeria');
    g.textContent = '';
    var indice = 0;

    agrupar(fotos).forEach(function (grupo) {
      var h = document.createElement('h2');
      h.className = 'grupo-fecha';
      h.textContent = titulo(grupo.fecha);
      var cuenta = document.createElement('span');
      cuenta.textContent = '  ' + grupo.fotos.length + (grupo.fotos.length === 1 ? ' foto' : ' fotos');
      h.appendChild(cuenta);
      g.appendChild(h);

      var r = document.createElement('div');
      r.className = 'rejilla';
      grupo.fotos.forEach(function (f) { r.appendChild(celda(f, indice++)); });
      g.appendChild(r);
    });

    if (window.SELECCION) {
      window.SELECCION.montar({
        tipo: 'fotos', contenedor: 'galeria', elemento: '.celda',
        recargar: function (bien, mal) {
          if (mal) avisar(mal, 'malo');
          else if (bien) avisar(bien, 'bien');
          cargar();
        },
      });
    }

    /* Se monta al terminar de pintar: las celdas son nuevas cada vez. */
    if (window.ARRASTRAR) {
      window.ARRASTRAR.montar({
        tipo: 'fotos', contenedor: 'galeria', elemento: '.celda',
        carpeta: '', horizontal: true,
        /* Solo dentro del mismo dia: los grupos son por fecha y moverla a otro
           no significaria nada, porque al recargar volveria con las suyas. */
        puedeSoltar: function (quien, sobre) {
          return quien.dataset.dia === sobre.dataset.dia;
        },
        ordenCompleto: ordenCompleto,
        alOrdenar: alOrdenar,
        recargar: function (bien, mal) {
          if (mal) avisar(mal, 'malo');
          else if (bien) avisar(bien, 'bien');
          aplicarFiltros();
        },
      });
    }

    $('vacio').hidden = fotos.length > 0;
    $('resumen').textContent = fotos.length
      ? fotos.length + (fotos.length === 1 ? ' foto' : ' fotos') + ' subidas'
      : 'Aquí aparecen las imágenes que subas.';
  }

  // ── Visor ─────────────────────────────────────────────────────────────────

  function abrir(i) {
    actual = i;
    $('visor').hidden = false;
    document.body.style.overflow = 'hidden';
    /* La tira PRIMERO: mostrar() acaba llamando a marcarTira(), y si la tira
       todavia no existe se marca la nada y luego se reconstruye sin marca. */
    pintarTira();
    mostrar();
  }

  function cerrar() {
    /* Sin esto el vídeo sigue sonando con el visor cerrado. */
    var vid = $('v-video');
    if (vid) { vid.pause(); vid.removeAttribute('src'); }
    $('visor').hidden = true;
    document.body.style.overflow = '';
    actual = -1;
  }

  function mostrar() {
    var f = fotos[actual];
    if (!f) return;
    $('v-nombre').textContent = f.nombre;
    $('v-datos').textContent = new Date(f.fecha).toLocaleString('es-ES', {
      day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit',
    }) + ' · ' + f.tamanoTexto;
    $('v-descargar').href = url.original(f);

    var img = $('v-img');
    var vid = $('v-video');

    /* Un vídeo no se precarga ni se amplía: se reproduce. El elemento vive
       escondido en la página y se enciende solo cuando toca, para que pasar
       entre fotos no arrastre un reproductor por detrás. */
    if (f.clase === 'video') {
      img.hidden = true;
      vid.hidden = false;
      vid.src = url.ver(f);
      vid.poster = url.mini(f);
      $('v-cargando').hidden = true;
      $('v-antes').disabled = actual <= 0;
      $('v-luego').disabled = actual >= fotos.length - 1;
      marcarTira();
      return;
    }

    vid.pause();
    vid.removeAttribute('src');
    vid.hidden = true;
    img.hidden = false;

    /* Primero la miniatura, que ya está en caché y entra al instante, y encima
       la grande cuando llegue. Sin esto cada pase deja un hueco negro. */
    img.src = url.mini(f);
    img.style.opacity = '0.55';
    $('v-cargando').hidden = false;

    var grande = new Image();
    var pedida = actual;
    grande.onload = function () {
      if (pedida !== actual) return;      // ya se ha pasado a otra
      img.src = grande.src;
      img.style.opacity = '1';
      $('v-cargando').hidden = true;
    };
    grande.onerror = function () {
      if (pedida !== actual) return;
      img.style.opacity = '1';
      $('v-cargando').hidden = true;
    };
    grande.src = url.grande(f);

    $('v-antes').disabled = actual <= 0;
    $('v-luego').disabled = actual >= fotos.length - 1;
    marcarTira();
  }

  function pintarTira() {
    var t = $('v-tira');
    t.textContent = '';
    fotos.forEach(function (f, i) {
      var img = document.createElement('img');
      img.src = url.mini(f);
      img.loading = 'lazy';
      img.alt = '';
      img.onclick = function () { actual = i; mostrar(); };
      t.appendChild(img);
    });
  }

  function marcarTira() {
    var hijos = $('v-tira').children;
    for (var i = 0; i < hijos.length; i++) {
      hijos[i].classList.toggle('actual', i === actual);
    }
    if (hijos[actual]) hijos[actual].scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function pasar(n) {
    var siguiente = actual + n;
    if (siguiente < 0 || siguiente >= fotos.length) return;
    actual = siguiente;
    mostrar();
  }

  $('v-compartir').onclick = function () {
    var f = fotos[actual];
    if (f) Compartir.abrir('fotos', f);
  };

  $('v-cerrar').onclick = cerrar;
  $('v-antes').onclick = function () { pasar(-1); };
  $('v-luego').onclick = function () { pasar(1); };

  $('v-borrar').onclick = async function () {
    var f = fotos[actual];
    if (!f) return;
    if (!confirm('Se borra del disco «' + f.nombre + '» (' + f.tamanoTexto + ').'
               + '\n\nNo hay vuelta atrás.')) return;
    try {
      await api('/api/f/' + f.seccion + '?f=' + encodeURIComponent(f.rel), { method: 'DELETE' });
      fotos.splice(actual, 1);
      if (!fotos.length) { cerrar(); }
      else { if (actual >= fotos.length) actual = fotos.length - 1; mostrar(); pintarTira(); }
      pintar();
      avisar('Foto eliminada.', 'bueno');
    } catch (err) { avisar(err.message, 'malo'); }
  };

  document.addEventListener('keydown', function (e) {
    // Con el cuadro de compartir abierto, las flechas no deben pasar de foto
    var qr = document.getElementById('qr');
    if (qr && !qr.hidden) return;
    if ($('visor').hidden) return;
    if (e.key === 'Escape') cerrar();
    else if (e.key === 'ArrowLeft') pasar(-1);
    else if (e.key === 'ArrowRight') pasar(1);
  });

  /* Deslizar con el dedo, que es como se pasa una foto en un teléfono. Se mide
     también el movimiento vertical: sin eso, bajar la página dentro del visor
     cambia de foto sin querer. */
  var x0 = null, y0 = null;
  var cuerpo = $('v-cuerpo');
  cuerpo.addEventListener('touchstart', function (e) {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  cuerpo.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) pasar(dx < 0 ? 1 : -1);
    x0 = y0 = null;
  }, { passive: true });


  // ── Filtros ───────────────────────────────────────────────────────────────

  /* `todo` es lo que hay; `fotos` es lo que se está viendo. El visor, la tira
     y el paso de una a otra trabajan siempre sobre lo que se ve, así que
     filtrar es recalcular esa lista y volver a pintar. */
  var todo = [];
  var filtroClase = 'todo';
  var filtroPeriodo = '';

  var mesDe = function (ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  };

  function llenarPeriodos() {
    var vistos = [];
    for (var i = 0; i < todo.length; i++) {
      var m = mesDe(todo[i].fecha);
      if (vistos.indexOf(m) < 0) vistos.push(m);
    }
    var sel = $('periodo');
    for (var j = 0; j < vistos.length; j++) {
      var partes = vistos[j].split('-');
      var o = document.createElement('option');
      o.value = vistos[j];
      o.textContent = new Date(partes[0], partes[1] - 1, 1)
        .toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
      sel.appendChild(o);
    }
  }

  function aplicarFiltros() {
    fotos = todo.filter(function (f) {
      if (filtroClase !== 'todo' && f.clase !== filtroClase) return false;
      if (filtroPeriodo && mesDe(f.fecha) !== filtroPeriodo) return false;
      return true;
    });
    pintar();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.filtro') : null;
    if (!b) return;
    filtroClase = b.dataset.clase;
    var todos = document.querySelectorAll('.filtro');
    for (var i = 0; i < todos.length; i++) {
      todos[i].classList.toggle('on', todos[i] === b);
    }
    aplicarFiltros();
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'periodo') {
      filtroPeriodo = e.target.value;
      aplicarFiltros();
    }
  });

  // ── Arranque ──────────────────────────────────────────────────────────────


  (async function () {
    try {
      var d = await api('/api/fotos/todas');
      todo = porDia(d.fotos || []);
      llenarPeriodos();
      aplicarFiltros();
      $('filtros').hidden = todo.length === 0;
    } catch (err) {
      avisar(err.message, 'malo');
      $('resumen').textContent = '';
    }
  })();
})();
</script>

<script src="/js/compartir.js"></script>
<script src="/js/espacio.js"></script>
<script src="/js/ajustes.js"></script>
<script src="/js/mejoras.js" defer></script>
</body>
