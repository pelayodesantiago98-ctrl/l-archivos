<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galería — lepayimio.es</title>
<link rel="icon" href="/img/galeria-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/galeria-180.png">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1f3b">
<link rel="stylesheet" href="/css/comun.css">
<style>
/* El color de esta sección: carmín, como su icono. */
:root { --tinte-1: #8f2f52; --tinte-2: #c2436b; }
/*
 * Galería, al modo de la de un teléfono: cuadrados pegados, agrupados por
 * fecha, y el visor a pantalla completa por encima de todo.
 */

.grupo-fecha {
  margin: 1.5rem 0 0.6rem;
  font-size: 1rem;
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
}
.grupo-fecha span { color: var(--texto-suave); font-weight: 400; font-size: 0.82rem; }

/* auto-fill y no auto-fit: con pocas fotos, auto-fit las estira hasta ocupar
   toda la fila y una foto suelta sale del tamaño de la pantalla. */
.rejilla {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr));
  gap: 3px;
}
@media (max-width: 34rem) {
  .rejilla { grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); }
}

.celda {
  position: relative;
  aspect-ratio: 1;
  background: rgba(255, 255, 255, 0.07);
  border: 0;
  border-radius: 3px;
  padding: 0;
  overflow: hidden;
  cursor: pointer;
}
.celda img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 0.25s;
}
.celda img.puesta { opacity: 1; }
.celda:hover img { transform: scale(1.04); transition: transform 0.25s, opacity 0.25s; }
.celda .rota {
  display: grid;
  place-items: center;
  height: 100%;
  padding: 0.4rem;
  color: var(--texto-suave);
  font-size: 0.62rem;
  text-align: center;
  overflow-wrap: anywhere;
}

/* ── Vista previa al pasar el ratón ───────────────────────────────────────── */

/*
 * Como el vistazo rápido de iOS: se deja el ratón encima y la foto crece sobre
 * la rejilla, sin llegar a abrirla.
 *
 * Solo con ratón. En una pantalla táctil no hay "estar encima sin pulsar": el
 * dedo o toca o no toca, y esto se dispararía en cada intento de abrir una.
 */
.vistazo {
  position: fixed;
  z-index: 45;
  padding: 0.4rem;
  background: rgba(20, 22, 38, 0.72);
  border: 1px solid var(--cristal-borde);
  border-radius: 0.9rem;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  pointer-events: none;
  opacity: 0;
  transform: scale(0.94);
  transition: opacity 0.16s ease, transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
}
.vistazo.puesto { opacity: 1; transform: scale(1); }
.vistazo img { display: block; border-radius: 0.6rem; }
.vistazo .pie {
  padding: 0.4rem 0.2rem 0.1rem;
  color: var(--texto-suave);
  font-size: 0.75rem;
  text-align: center;
  overflow-wrap: anywhere;
}

@media (hover: none) {
  .vistazo { display: none; }
}

/* ── Visor ────────────────────────────────────────────────────────────────── */

.visor {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: rgba(0, 0, 0, 0.94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.visor-cab {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.8rem 1rem;
  padding-top: max(0.8rem, env(safe-area-inset-top));
}
.visor-nombre {
  flex: 1;
  min-width: 0;
  font-size: 0.9rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.visor-datos { color: var(--texto-suave); font-size: 0.78rem; }

.visor-cuerpo {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 0;
  /* Red de seguridad: si algo vuelve a crecer de más, se recorta aquí en vez de
     irse por encima de los botones. */
  overflow: hidden;
  padding: 0 0.5rem;
}
.visor-cuerpo img {
  /*
   * Alto y ancho al 100% con scale-down, en vez de max-width/max-height.
   *
   * Con max-height: 100% la imagen se salía por abajo y tapaba los botones:
   * en un contenedor grid cuya altura la resuelve un "1fr", ese porcentaje se
   * queda indefinido en el momento del cálculo y el navegador acaba aplicando
   * solo el ancho. Medido: una foto de 1600x1200 se pintaba a 1068 px de alto
   * dentro de un hueco de 713, o sea 231 px por debajo del borde.
   *
   * Dándole la caja entera y dejando que object-fit decida, el tamaño ya no
   * depende de resolver ningún porcentaje. scale-down y no contain para que una
   * foto pequeña no se amplíe hasta verse pastosa: se queda a su tamaño.
   */
  width: 100%;
  height: 100%;
  object-fit: scale-down;
  /* La foto llega en dos pasos: primero la miniatura, que ya está en caché y
     aparece al instante, y encima la grande cuando termina de bajar. Sin esto
     se queda un hueco negro en cada pase. */
  transition: opacity 0.2s;
}
.visor-cuerpo .cargando {
  position: absolute;
  color: var(--texto-suave);
  font-size: 0.85rem;
}

.flecha {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: grid;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  color: var(--texto);
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid var(--cristal-borde);
  border-radius: 50%;
  font-size: 1.2rem;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.flecha.izq { left: 0.6rem; }
.flecha.der { right: 0.6rem; }
.flecha:disabled { opacity: 0.25; cursor: default; }

.visor-pie {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
  padding: 0.9rem 1rem;
  padding-bottom: max(0.9rem, env(safe-area-inset-bottom));
}

.tira {
  display: flex;
  gap: 3px;
  overflow-x: auto;
  padding: 0 1rem 0.6rem;
  scrollbar-width: none;
}
.tira::-webkit-scrollbar { display: none; }
.tira img {
  width: 3rem;
  height: 3rem;
  object-fit: cover;
  border-radius: 4px;
  opacity: 0.45;
  cursor: pointer;
  flex: none;
}
.tira img.actual { opacity: 1; outline: 2px solid #fff; outline-offset: -2px; }


/* ── Filtros de la galería ─────────────────────────────────────────────── */
.filtros {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .8rem;
  margin: 0 0 1rem;
}
.filtro-grupo { display: flex; gap: .3rem; }
.filtro {
  border: 1px solid var(--linea, rgba(255,255,255,.14));
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: .85rem;
  padding: .35rem .8rem;
  border-radius: 999px;
  cursor: pointer;
}
.filtro:hover { border-color: var(--tinte-2, #c2436b); }
.filtro.on {
  background: var(--tinte-2, #c2436b);
  border-color: var(--tinte-2, #c2436b);
  color: #fff;
}
.filtro-fecha { display: flex; align-items: center; gap: .4rem; font-size: .85rem; opacity: .85; }
.filtro-fecha select {
  font: inherit;
  font-size: .85rem;
  padding: .3rem .5rem;
  border-radius: 8px;
  border: 1px solid var(--linea, rgba(255,255,255,.14));
  background: rgba(0,0,0,.2);
  color: inherit;
}

/* El distintivo de vídeo sobre su fotograma. */
.celda { position: relative; }
.es-video {
  position: absolute;
  right: .35rem;
  bottom: .35rem;
  width: 1.5rem;
  height: 1.5rem;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, .55);
  color: #fff;
  font-size: .7rem;
  line-height: 1;
  pointer-events: none;
}

#v-video { max-width: 100%; max-height: 80vh; border-radius: 10px; background: #000; }
</style>
<!-- Antes que el guion de la pagina, que lo monta al pintar. -->
<script src="/js/arrastrar.js"></script>
<script src="/js/seleccion.js"></script>
</head>
<body>

<div class="envoltorio">

  <nav class="barra">
    <h1 class="titulo-con-icono">
      <img class="titulo-icono" src="/img/fotos-180.png" alt="" width="44" height="44">
      Galería
      </h1>
  </nav>

  <p class="entradilla" id="resumen">…</p>

  <div id="recado" class="recado" hidden></div>

  <div class="filtros" id="filtros" hidden>
    <div class="filtro-grupo" role="group" aria-label="Qué enseñar">
      <button type="button" class="filtro on" data-clase="todo">Todo</button>
      <button type="button" class="filtro" data-clase="foto">Fotos</button>
      <button type="button" class="filtro" data-clase="video">Vídeos</button>
    </div>
    <label class="filtro-fecha">
      <span>Cuándo</span>
      <select id="periodo"><option value="">Cualquier fecha</option></select>
    </label>
    <button type="button" class="boton" id="seleccionar" aria-pressed="false">Seleccionar</button>
  </div>

  <div id="galeria"></div>
  <p class="nada" id="vacio" hidden>
    Todavía no hay fotos. Súbelas desde <a href="/" style="color:inherit">Archivos</a>
    eligiendo «imagen».
  </p>

</div>

<div class="visor" id="visor" hidden>
  <div class="visor-cab">
    <div>
      <div class="visor-nombre" id="v-nombre"></div>
      <div class="visor-datos" id="v-datos"></div>
    </div>
    <button class="mini" id="v-cerrar" type="button">Cerrar</button>
  </div>

  <div class="visor-cuerpo" id="v-cuerpo">
    <button class="flecha izq" id="v-antes" type="button" aria-label="Anterior">‹</button>
    <video id="v-video" controls playsinline hidden></video>
    <img id="v-img" alt="">
    <span class="cargando" id="v-cargando" hidden>cargando…</span>
    <button class="flecha der" id="v-luego" type="button" aria-label="Siguiente">›</button>
  </div>

  <div>
    <div class="tira" id="v-tira"></div>
    <div class="visor-pie">
      <button class="boton principal" id="v-compartir" type="button">Compartir</button>
      <a class="boton" id="v-descargar" download>Descargar original</a>
      <button class="boton" id="v-borrar" type="button">Eliminar</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var fotos = [];
  var actual = -1;

  function avisar(t, clase) {
    var r = $('recado');
    r.textContent = t;
    r.className = 'recado' + (clase ? ' ' + clase : '');
    r.hidden = !t;
    if (t && clase === 'bueno') setTimeout(function () { r.hidden = true; }, 5000);
  }

  async function api(ruta, opciones) {
    var res = await fetch(ruta, Object.assign({ credentials: 'same-origin' }, opciones || {}));
    var d = null;
    try { d = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((d && d.error) || ('Error ' + res.status));
    return d;
  }

  /* Cada cosa dice de qué sección sale: las fotos viven en `fotos` y los
     vídeos en `videos`, y son dos carpetas distintas en disco. */
  var url = {
    mini: function (f) { return '/api/f/' + f.seccion + '/mini?f=' + encodeURIComponent(f.rel); },
    grande: function (f) { return '/api/f/' + f.seccion + '/grande?f=' + encodeURIComponent(f.rel); },
    ver: function (f) { return '/api/f/' + f.seccion + '/ver?f=' + encodeURIComponent(f.rel); },
    original: function (f) { return '/api/f/' + f.seccion + '/ver?f=' + encodeURIComponent(f.rel) + '&descarga=1'; },
  };

  /* Agrupar por día, como la galería del teléfono: el montón sin cortes no se
     puede recorrer, y la fecha es lo único que todo el mundo recuerda de una
     foto. */
  /* El dia de una fecha, como numero comparable. */
  function claveDia(ms) {
    var d = new Date(ms);
    return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate();
  }

  /* El servidor manda primero lo que se ha colocado a mano y despues el resto.
     La galeria se enseña por dias, asi que aqui se ordena por dia —del mas
     nuevo al mas viejo— conservando dentro de cada uno el orden que traia.
     Sin esto, una foto recien subida saldria la ultima de toda la galeria en
     vez de con las de su fecha: el orden guardado todavia no la conoce. */
  function porDia(lista) {
    var sitio = new Map();
    lista.forEach(function (f, i) { sitio.set(f.rel, i); });
    return lista.slice().sort(function (a, b) {
      var da = claveDia(a.fecha), db = claveDia(b.fecha);
      if (da !== db) return db - da;
      return sitio.get(a.rel) - sitio.get(b.rel);
    });
  }

  /* La lista entera con lo que se ve recolocado. Con un filtro puesto, en
     pantalla solo hay una parte: guardar solo esa mandaria el resto al final.
     Lo que esta oculto se queda donde estaba. */
  function ordenCompleto(visibles) {
    var enPantalla = {};
    visibles.forEach(function (n) { enPantalla[n] = true; });
    var i = 0;
    return todo.map(function (f) {
      return enPantalla[f.nombre] ? visibles[i++] : f.nombre;
    });
  }

  /* Tras colocar, la lista de memoria tiene que quedar como el DOM: los
     numeros con los que el visor pasa de una foto a otra salen de ella. */
  function alOrdenar() {
    var visibles = [];
    Array.prototype.forEach.call(document.querySelectorAll('#galeria .celda'),
      function (n) { visibles.push(n.dataset.nombre); });

    var porNombre = {};
    todo.forEach(function (f) { porNombre[f.nombre] = f; });
    todo = ordenCompleto(visibles).map(function (n) { return porNombre[n]; })
      .filter(Boolean);
    aplicarFiltros();
  }

  function agrupar(lista) {
    var grupos = [];
    var ultimo = null;
    lista.forEach(function (f) {
      var d = new Date(f.fecha);
      var clave = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      if (!ultimo || ultimo.clave !== clave) {
        ultimo = { clave: clave, fecha: d, fotos: [] };
        grupos.push(ultimo);
      }
      ultimo.fotos.push(f);
    });
    return grupos;
  }

  function titulo(d) {
    var hoy = new Date();
    var ayer = new Date(hoy.getTime() - 86400000);
    var mismo = function (a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()
          && a.getDate() === b.getDate();
    };
    if (mismo(d, hoy)) return 'Hoy';
    if (mismo(d, ayer)) return 'Ayer';
    var opciones = { day: 'numeric', month: 'long' };
    if (d.getFullYear() !== hoy.getFullYear()) opciones.year = 'numeric';
    return d.toLocaleDateString('es-ES', opciones);
  }

  /* Las miniaturas se piden solo cuando la celda se acerca a la pantalla. Con
     doscientas fotos, pedirlas todas de golpe son doscientas peticiones y
     doscientas conversiones en el servidor, para ver doce. */
  var vigia = new IntersectionObserver(function (entradas) {
    entradas.forEach(function (e) {
      if (!e.isIntersecting) return;
      var img = e.target;
      vigia.unobserve(img);
      img.src = img.dataset.src;
    });
  }, { rootMargin: '300px' });

  function celda(f, indice) {
    var b = document.createElement('button');
    b.className = 'celda';
    b.type = 'button';
    b.title = f.nombre;
    /* Lo que el arrastre necesita saber. El día va aquí porque es lo que
       decide dónde se puede soltar, y calcularlo al vuelo en cada movimiento
       del puntero seria hacerlo cientos de veces por gesto. */
    b.dataset.rel = f.rel;
    b.dataset.nombre = f.nombre;
    b.dataset.carpeta = '0';
    b.dataset.dia = String(claveDia(f.fecha));
    b.onclick = function () { abrir(indice); };

    var img = document.createElement('img');
    img.alt = f.nombre;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.dataset.src = url.mini(f);
    img.onload = function () { img.classList.add('puesta'); };
    img.onerror = function () {
      /* Una foto que libvips no sabe abrir no puede llevarse por delante la
         rejilla entera: se queda su hueco con el nombre. */
      b.textContent = '';
      var d = document.createElement('div');
      d.className = 'rota';
      d.textContent = f.nombre;
      b.appendChild(d);
    };
    /* Medio segundo de espera: sin ella, pasar el ratón por encima para llegar
       a otro sitio va disparando vistazos por el camino. */
    if (conRaton) {
      b.addEventListener('mouseenter', function () {
        clearTimeout(esperaVistazo);
        esperaVistazo = setTimeout(function () { mostrarVistazo(f, b); }, 480);
      });
      b.addEventListener('mouseleave', ocultarVistazo);
    }

    b.appendChild(img);

    /* Un vídeo se tiene que reconocer antes de pulsarlo: su miniatura es un
       fotograma y sin esto parece una foto más. */
    if (f.clase === 'video') {
      var marca = document.createElement('span');
      marca.className = 'es-video';
      marca.setAttribute('aria-hidden', 'true');
      marca.textContent = '▶';
      b.appendChild(marca);
      b.title = f.nombre + ' (vídeo)';
    }

    vigia.observe(img);
    return b;
  }

  // ── Vistazo al pasar el ratón ─────────────────────────────────────────────

  var vistazo = null;
  var esperaVistazo = null;
  var conRaton = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  function cajaVistazo() {
    if (vistazo) return vistazo;
    vistazo = document.createElement('div');
    vistazo.className = 'vistazo';
    vistazo.innerHTML = '<img alt=""><div class="pie"></div>';
    document.body.appendChild(vistazo);
    return vistazo;
  }

  function mostrarVistazo(f, celda) {
    var v = cajaVistazo();
    var img = v.querySelector('img');
    v.querySelector('.pie').textContent = f.nombre;

    /* La miniatura ya está en caché, así que aparece al instante; la grande
       entra encima cuando llega. Sin eso, el vistazo tarda tanto en pintarse
       que para cuando aparece ya has movido el ratón. */
    img.src = url.mini(f);
    var lado = Math.min(360, Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.42));
    img.style.width = lado + 'px';
    img.style.height = lado + 'px';
    img.style.objectFit = 'cover';

    var grande = new Image();
    grande.onload = function () {
      if (!v.classList.contains('puesto')) return;   // ya se ha ido el ratón
      img.src = grande.src;
      img.style.height = 'auto';
      img.style.maxHeight = Math.round(window.innerHeight * 0.62) + 'px';
      img.style.objectFit = 'contain';
      colocar(celda, v);
    };
    grande.src = url.grande(f);

    v.classList.add('puesto');
    colocar(celda, v);
  }

  /* Se coloca al lado de la celda y se mete dentro de la pantalla si no cabe:
     una vista previa que se sale por el borde no sirve de nada. */
  function colocar(celda, v) {
    var c = celda.getBoundingClientRect();
    var b = v.getBoundingClientRect();
    var x = c.left + c.width / 2 - b.width / 2;
    var y = c.top - b.height - 12;
    if (y < 8) y = c.bottom + 12;                       // no cabe arriba: debajo
    if (y + b.height > window.innerHeight - 8) y = Math.max(8, window.innerHeight - b.height - 8);
    x = Math.max(8, Math.min(x, window.innerWidth - b.width - 8));
    v.style.left = Math.round(x) + 'px';
    v.style.top = Math.round(y) + 'px';
  }

  function ocultarVistazo() {
    clearTimeout(esperaVistazo);
    if (vistazo) vistazo.classList.remove('puesto');
  }
  var botonSeleccionar = $('seleccionar');
  if (botonSeleccionar && window.SELECCION) {
    botonSeleccionar.addEventListener('click', function () {
      var encendida = window.SELECCION.activa();
      if (encendida) window.SELECCION.apagar();
      else window.SELECCION.encender();
      botonSeleccionar.setAttribute('aria-pressed', encendida ? 'false' : 'true');
      botonSeleccionar.classList.toggle('activo', !encendida);
    });
  }


  function pintar() {
    var g = $('galeria');
    g.textContent = '';
    var indice = 0;

    agrupar(fotos).forEach(function (grupo) {
      var h = document.createElement('h2');
      h.className = 'grupo-fecha';
      h.textContent = titulo(grupo.fecha);
      var cuenta = document.createElement('span');
      cuenta.textContent = '  ' + grupo.fotos.length + (grupo.fotos.length === 1 ? ' foto' : ' fotos');
      h.appendChild(cuenta);
      g.appendChild(h);

      var r = document.createElement('div');
      r.className = 'rejilla';
      grupo.fotos.forEach(function (f) { r.appendChild(celda(f, indice++)); });
      g.appendChild(r);
    });

    if (window.SELECCION) {
      window.SELECCION.montar({
        tipo: 'fotos', contenedor: 'galeria', elemento: '.celda',
        recargar: function (bien, mal) {
          if (mal) avisar(mal, 'malo');
          else if (bien) avisar(bien, 'bien');
          cargar();
        },
      });
    }

    /* Se monta al terminar de pintar: las celdas son nuevas cada vez. */
    if (window.ARRASTRAR) {
      window.ARRASTRAR.montar({
        tipo: 'fotos', contenedor: 'galeria', elemento: '.celda',
        carpeta: '', horizontal: true,
        /* Solo dentro del mismo dia: los grupos son por fecha y moverla a otro
           no significaria nada, porque al recargar volveria con las suyas. */
        puedeSoltar: function (quien, sobre) {
          return quien.dataset.dia === sobre.dataset.dia;
        },
        ordenCompleto: ordenCompleto,
        alOrdenar: alOrdenar,
        recargar: function (bien, mal) {
          if (mal) avisar(mal, 'malo');
          else if (bien) avisar(bien, 'bien');
          aplicarFiltros();
        },
      });
    }

    $('vacio').hidden = fotos.length > 0;
    $('resumen').textContent = fotos.length
      ? fotos.length + (fotos.length === 1 ? ' foto' : ' fotos') + ' subidas'
      : 'Aquí aparecen las imágenes que subas.';
  }

  // ── Visor ─────────────────────────────────────────────────────────────────

  function abrir(i) {
    ocultarVistazo();
    actual = i;
    $('visor').hidden = false;
    document.body.style.overflow = 'hidden';
    mostrar();
    pintarTira();
  }

  function cerrar() {
    /* Sin esto el vídeo sigue sonando con el visor cerrado. */
    var vid = $('v-video');
    if (vid) { vid.pause(); vid.removeAttribute('src'); }
    $('visor').hidden = true;
    document.body.style.overflow = '';
    actual = -1;
  }

  function mostrar() {
    var f = fotos[actual];
    if (!f) return;
    $('v-nombre').textContent = f.nombre;
    $('v-datos').textContent = new Date(f.fecha).toLocaleString('es-ES', {
      day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit',
    }) + ' · ' + f.tamanoTexto;
    $('v-descargar').href = url.original(f);

    var img = $('v-img');
    var vid = $('v-video');

    /* Un vídeo no se precarga ni se amplía: se reproduce. El elemento vive
       escondido en la página y se enciende solo cuando toca, para que pasar
       entre fotos no arrastre un reproductor por detrás. */
    if (f.clase === 'video') {
      img.hidden = true;
      vid.hidden = false;
      vid.src = url.ver(f);
      vid.poster = url.mini(f);
      $('v-cargando').hidden = true;
      $('v-antes').disabled = actual <= 0;
      $('v-luego').disabled = actual >= fotos.length - 1;
      marcarTira();
      return;
    }

    vid.pause();
    vid.removeAttribute('src');
    vid.hidden = true;
    img.hidden = false;

    /* Primero la miniatura, que ya está en caché y entra al instante, y encima
       la grande cuando llegue. Sin esto cada pase deja un hueco negro. */
    img.src = url.mini(f);
    img.style.opacity = '0.55';
    $('v-cargando').hidden = false;

    var grande = new Image();
    var pedida = actual;
    grande.onload = function () {
      if (pedida !== actual) return;      // ya se ha pasado a otra
      img.src = grande.src;
      img.style.opacity = '1';
      $('v-cargando').hidden = true;
    };
    grande.onerror = function () {
      if (pedida !== actual) return;
      img.style.opacity = '1';
      $('v-cargando').hidden = true;
    };
    grande.src = url.grande(f);

    $('v-antes').disabled = actual <= 0;
    $('v-luego').disabled = actual >= fotos.length - 1;
    marcarTira();
  }

  function pintarTira() {
    var t = $('v-tira');
    t.textContent = '';
    fotos.forEach(function (f, i) {
      var img = document.createElement('img');
      img.src = url.mini(f);
      img.loading = 'lazy';
      img.alt = '';
      img.onclick = function () { actual = i; mostrar(); };
      t.appendChild(img);
    });
  }

  function marcarTira() {
    var hijos = $('v-tira').children;
    for (var i = 0; i < hijos.length; i++) {
      hijos[i].classList.toggle('actual', i === actual);
    }
    if (hijos[actual]) hijos[actual].scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function pasar(n) {
    var siguiente = actual + n;
    if (siguiente < 0 || siguiente >= fotos.length) return;
    actual = siguiente;
    mostrar();
  }

  $('v-compartir').onclick = function () {
    var f = fotos[actual];
    if (f) Compartir.abrir('fotos', f);
  };

  $('v-cerrar').onclick = cerrar;
  $('v-antes').onclick = function () { pasar(-1); };
  $('v-luego').onclick = function () { pasar(1); };

  $('v-borrar').onclick = async function () {
    var f = fotos[actual];
    if (!f) return;
    if (!confirm('Se borra del disco «' + f.nombre + '» (' + f.tamanoTexto + ').'
               + '\n\nNo hay vuelta atrás.')) return;
    try {
      await api('/api/f/fotos?f=' + encodeURIComponent(f.rel), { method: 'DELETE' });
      fotos.splice(actual, 1);
      if (!fotos.length) { cerrar(); }
      else { if (actual >= fotos.length) actual = fotos.length - 1; mostrar(); pintarTira(); }
      pintar();
      avisar('Foto eliminada.', 'bueno');
    } catch (err) { avisar(err.message, 'malo'); }
  };

  document.addEventListener('keydown', function (e) {
    // Con el cuadro de compartir abierto, las flechas no deben pasar de foto
    var qr = document.getElementById('qr');
    if (qr && !qr.hidden) return;
    if ($('visor').hidden) return;
    if (e.key === 'Escape') cerrar();
    else if (e.key === 'ArrowLeft') pasar(-1);
    else if (e.key === 'ArrowRight') pasar(1);
  });

  /* Deslizar con el dedo, que es como se pasa una foto en un teléfono. Se mide
     también el movimiento vertical: sin eso, bajar la página dentro del visor
     cambia de foto sin querer. */
  var x0 = null, y0 = null;
  var cuerpo = $('v-cuerpo');
  cuerpo.addEventListener('touchstart', function (e) {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  cuerpo.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) pasar(dx < 0 ? 1 : -1);
    x0 = y0 = null;
  }, { passive: true });


  // ── Filtros ───────────────────────────────────────────────────────────────

  /* `todo` es lo que hay; `fotos` es lo que se está viendo. El visor, la tira
     y el paso de una a otra trabajan siempre sobre lo que se ve, así que
     filtrar es recalcular esa lista y volver a pintar. */
  var todo = [];
  var filtroClase = 'todo';
  var filtroPeriodo = '';

  var mesDe = function (ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  };

  function llenarPeriodos() {
    var vistos = [];
    for (var i = 0; i < todo.length; i++) {
      var m = mesDe(todo[i].fecha);
      if (vistos.indexOf(m) < 0) vistos.push(m);
    }
    var sel = $('periodo');
    for (var j = 0; j < vistos.length; j++) {
      var partes = vistos[j].split('-');
      var o = document.createElement('option');
      o.value = vistos[j];
      o.textContent = new Date(partes[0], partes[1] - 1, 1)
        .toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
      sel.appendChild(o);
    }
  }

  function aplicarFiltros() {
    fotos = todo.filter(function (f) {
      if (filtroClase !== 'todo' && f.clase !== filtroClase) return false;
      if (filtroPeriodo && mesDe(f.fecha) !== filtroPeriodo) return false;
      return true;
    });
    pintar();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.filtro') : null;
    if (!b) return;
    filtroClase = b.dataset.clase;
    var todos = document.querySelectorAll('.filtro');
    for (var i = 0; i < todos.length; i++) {
      todos[i].classList.toggle('on', todos[i] === b);
    }
    aplicarFiltros();
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'periodo') {
      filtroPeriodo = e.target.value;
      aplicarFiltros();
    }
  });

  // ── Arranque ──────────────────────────────────────────────────────────────

  window.addEventListener('scroll', ocultarVistazo, { passive: true });

  (async function () {
    try {
      var d = await api('/api/fotos/todas');
      todo = porDia(d.fotos || []);
      llenarPeriodos();
      aplicarFiltros();
      $('filtros').hidden = todo.length === 0;
    } catch (err) {
      avisar(err.message, 'malo');
      $('resumen').textContent = '';
    }
  })();
})();
</script>

<script src="/js/compartir.js"></script>
<script src="/js/espacio.js"></script>
<script src="/js/ajustes.js"></script>
</body>
</html>
