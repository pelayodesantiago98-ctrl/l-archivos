<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Documentos — lepayimio.es</title>
<link rel="icon" href="/img/documentos-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/documentos-180.png">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1f3b">
<link rel="stylesheet" href="/css/comun.css">
<style>
/* El color de esta sección: verde hoja, como su icono. */
:root { --tinte-1: #1f6b4c; --tinte-2: #2f8f66; }
  .lista { display: grid; gap: 0.5rem; }

  .herramientas {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.1rem;
  }

  .fila {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.7rem 0.9rem;
    background: var(--cristal);
    border: 1px solid var(--cristal-borde);
    border-radius: 0.9rem;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    cursor: pointer;
    text-align: left;
    width: 100%;
    color: inherit;
    font: inherit;
  }
  .fila:hover { background: rgba(255, 255, 255, 0.2); }

  /* La extensión como icono: cuatro letras dicen más que un dibujo genérico de
     hoja, y no hay que mantener un juego de iconos por formato. */
  .sello {
    display: grid;
    place-items: center;
    width: 2.6rem;
    height: 2.6rem;
    flex: none;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 0.6rem;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .sello.carpeta { background: rgba(255, 214, 10, 0.22); font-size: 1.1rem; }
  .sello.doc { background: rgba(90, 140, 255, 0.28); }
  .sello.hoja { background: rgba(126, 224, 168, 0.24); }
  .sello.pdf { background: rgba(255, 143, 134, 0.24); }
  .sello.txt { background: rgba(255, 255, 255, 0.18); }

  .fila-cuerpo { flex: 1; min-width: 0; }
  .fila-nombre { font-size: 0.92rem; font-weight: 550; overflow-wrap: anywhere; }
  .fila-datos { color: var(--texto-suave); font-size: 0.78rem; }
  .fila-acciones { display: flex; gap: 0.35rem; flex: none; }

  /* ── Visor ──────────────────────────────────────────────────────────────── */

  .visor {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    grid-template-rows: auto 1fr;
    background: rgba(10, 12, 24, 0.97);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .visor-cab {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    padding-top: max(0.85rem, env(safe-area-inset-top));
    border-bottom: 1px solid var(--cristal-borde);
  }
  .visor-nombre { flex: 1; min-width: 0; font-size: 0.92rem; font-weight: 600; overflow-wrap: anywhere; }
  .visor-cuerpo { overflow: auto; padding: 1.5rem; }
  .hoja-papel {
    max-width: 46rem;
    margin: 0 auto;
    padding: 2.5rem 2.75rem;
    color: #16181f;
    background: #fbfbf9;
    border-radius: 0.5rem;
    line-height: 1.65;
  }
  @media (max-width: 34rem) {
    .visor-cuerpo { padding: 0.6rem; }
    .hoja-papel { padding: 1.4rem 1.2rem; }
  }
  .hoja-papel h1, .hoja-papel h2, .hoja-papel h3 { margin: 1.4em 0 0.4em; line-height: 1.25; }
  .hoja-papel h1:first-child, .hoja-papel h2:first-child { margin-top: 0; }
  .hoja-papel p { margin: 0 0 0.85em; }
  .hoja-papel li { margin-bottom: 0.3em; }
  .hoja-papel pre {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .tabla-caja { overflow: auto; max-width: 100%; }
  table { border-collapse: collapse; font-size: 0.85rem; }
  th, td {
    padding: 0.35rem 0.6rem;
    border: 1px solid rgba(0, 0, 0, 0.14);
    text-align: left;
    white-space: nowrap;
  }
  thead th { background: rgba(0, 0, 0, 0.07); font-weight: 600; position: sticky; top: 0; }
  .nombre-hoja { margin: 1.5rem 0 0.5rem; font-size: 0.95rem; font-weight: 600; }
  .nombre-hoja:first-child { margin-top: 0; }

  .lamina {
    max-width: 46rem;
    margin: 0 auto 1rem;
    padding: 1.5rem 1.75rem;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid var(--cristal-borde);
    border-radius: 0.75rem;
  }
  .lamina-num { color: var(--texto-suave); font-size: 0.72rem; margin-bottom: 0.5rem; }
  .lamina p { margin: 0 0 0.4em; }
  .lamina p:first-of-type { font-size: 1.1rem; font-weight: 600; }

  .visor-cuerpo iframe { width: 100%; height: 100%; border: 0; border-radius: 0.5rem; background: #fff; }
  .visor-cuerpo > img { display: block; max-width: 100%; margin: 0 auto; border-radius: 0.5rem; }

  .sin-visor { max-width: 30rem; margin: 3rem auto; text-align: center; }
  .sin-visor p { color: var(--texto-suave); margin-bottom: 1.25rem; }

/* ── Rejilla de documentos ────────────────────────────────────────────────
   Iconos con el nombre debajo, como la nube de un teléfono: en una carpeta de
   veinte cosas se reconoce antes por la forma que leyendo una lista. */
/* ── El menú de Nuevo ─────────────────────────────────────────────────── */
.menu-nuevo { position: relative; }
.menu-nuevo-lista {
  position: absolute;
  top: calc(100% + .35rem);
  left: 0;
  z-index: 30;
  min-width: 12rem;
  display: flex;
  flex-direction: column;
  padding: .3rem;
  border-radius: 12px;
  border: 1px solid var(--linea, rgba(255, 255, 255, .14));
  background: var(--fondo-2, #1b1f2b);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
}
.menu-nuevo-lista button {
  display: flex;
  align-items: center;
  gap: .55rem;
  padding: .5rem .6rem;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: .88rem;
  text-align: left;
  cursor: pointer;
}
.menu-nuevo-lista button:hover { background: rgba(255, 255, 255, .08); }
.menu-nuevo-lista .sello {
  width: 2rem;
  height: 1.5rem;
  border-radius: 5px;
  display: grid;
  place-items: center;
  font-size: .58rem;
  font-weight: 700;
  flex: none;
}
.sello.pres { background: rgba(255, 168, 122, .24); }
</style>
<!-- Antes que el guion de la pagina, que lo usa para pintar cada ficha. -->
<script src="/js/iconos.js"></script>
<!-- Antes que el guion de la pagina, que engancha su boton. -->
<script src="/js/seleccion.js"></script>
<script src="/js/arrastrar.js"></script>
</head>
<body>

<div class="envoltorio">

  <nav class="barra">
    <h1 class="titulo-con-icono">
      <img class="titulo-icono" src="/img/documentos-180.png" alt="" width="44" height="44">
      Documentos
      </h1>
  </nav>



  <div id="recado" class="recado" hidden></div>
  <div class="migas" id="migas"></div>

  <div class="herramientas">
    <div class="menu-nuevo">
      <button class="boton principal" id="nuevo" type="button"
              aria-haspopup="true" aria-expanded="false">Nuevo ▾</button>
      <div class="menu-nuevo-lista" id="menu-nuevo" hidden role="menu">
        <button type="button" role="menuitem" data-clase="documento">
          <span class="sello doc">DOC</span>Documento
        </button>
        <button type="button" role="menuitem" data-clase="hoja">
          <span class="sello hoja">XLS</span>Hoja de cálculo
        </button>
        <button type="button" role="menuitem" data-clase="presentacion">
          <span class="sello pres">PPT</span>Presentación
        </button>
        <button type="button" role="menuitem" data-clase="texto">
          <span class="sello txt">TXT</span>Texto plano
        </button>
      </div>
    </div>
    <button class="boton" id="nueva" type="button">Nueva carpeta</button>
    <button class="boton" id="seleccionar" type="button" aria-pressed="false">Seleccionar</button>
  </div>

  <div class="rejilla-docs" id="lista"></div>
  <p class="nada" id="vacio" hidden>
    Aquí no hay nada. Sube documentos desde <a href="/" style="color:inherit">Archivos</a>.
  </p>

</div>

<div class="visor" id="visor" hidden>
  <div class="visor-cab">
    <div class="visor-nombre" id="v-nombre"></div>
    <button class="mini" id="v-editar" type="button">Editar</button>
    <button class="mini" id="v-pdf" type="button">A PDF</button>
    <button class="mini" id="v-compartir" type="button">Compartir</button>
    <a class="mini" id="v-descargar" download>Descargar</a>
    <button class="mini" id="v-cerrar" type="button">Cerrar</button>
  </div>
  <div class="visor-cuerpo" id="v-cuerpo"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var aqui = '';

  function avisar(t, clase) {
    var r = $('recado');
    r.textContent = t;
    r.className = 'recado' + (clase ? ' ' + clase : '');
    r.hidden = !t;
    if (t && clase === 'bueno') setTimeout(function () { r.hidden = true; }, 5000);
  }

  async function api(ruta, opciones) {
    var res = await fetch(ruta, Object.assign({ credentials: 'same-origin' }, opciones || {}));
    var d = null;
    try { d = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((d && d.error) || ('Error ' + res.status));
    return d;
  }

  var verUrl = function (rel, descarga) {
    return '/api/f/documentos/ver?f=' + encodeURIComponent(rel) + (descarga ? '&descarga=1' : '');
  };

  /* Los formatos que LibreOffice sabe pasar a PDF; es la misma lista que
     usa el servidor, y si no coincidiera el botón saldría para nada. */
  var CONVERTIBLE = /\.(docx?|xlsx?|pptx?|odt|ods|odp|rtf|txt|csv|html?)$/i;











  /* Una tarjeta por cosa: el icono del tipo arriba y el nombre debajo, como
     en la nube de cualquier telefono. El nombre no se recorta con puntos
     suspensivos a la primera linea: se deja en dos, que es lo que hace falta
     para distinguir «Informe enero» de «Informe febrero». */
  function fila(x) {
    var caja = document.createElement('div');
    caja.className = 'doc';
    /* Lo único que el arrastre necesita saber de cada cosa. */
    caja.dataset.rel = x.rel;
    caja.dataset.nombre = x.nombre;
    caja.dataset.carpeta = x.tipo === 'carpeta' ? '1' : '0';

    var b = document.createElement('button');
    b.className = 'doc-abrir';
    b.type = 'button';
    b.title = x.nombre;

    var s = document.createElement('div');
    s.className = 'doc-icono';
    /* El dibujo se compone aquí y no se pide al servidor: es SVG, lo escribe
       este mismo fichero y no hay nada del usuario dentro. */
    s.innerHTML = x.tipo === 'carpeta' ? ICONOS.carpeta()
      : ICONOS.de(ICONOS.clase(x.ext), x.ext);

    var n = document.createElement('div');
    n.className = 'doc-nombre';
    /* Recortado, con el entero al dejar el cursor encima. */
    n.textContent = ICONOS.nombreCorto(x.nombre);
    n.title = x.nombre;

    var d = document.createElement('div');
    d.className = 'doc-datos';
    d.textContent = x.tipo === 'carpeta'
      ? (x.cuantos + (x.cuantos === 1 ? ' elemento' : ' elementos'))
      : x.tamanoTexto;

    b.appendChild(s);
    b.appendChild(n);
    b.appendChild(d);
    b.onclick = function () {
      if (x.tipo === 'carpeta') cargar(x.rel);
      else abrir(x);
    };
    caja.appendChild(b);

    if (x.tipo !== 'carpeta') {
      var acciones = document.createElement('div');
      acciones.className = 'doc-acciones';

      if (EDITABLE.test(x.nombre)) {
        var ed = document.createElement('button');
        ed.type = 'button';
        ed.textContent = 'Editar';
        ed.onclick = function (e) {
          e.stopPropagation();
          location.href = '/editar?tipo=documentos&f=' + encodeURIComponent(x.rel);
        };
        acciones.appendChild(ed);
      }

      /* Convertir sin abrir. Antes solo se podia desde dentro del visor, y para
         pasar cuatro documentos a PDF habia que abrirlos de uno en uno. */
      if (CONVERTIBLE.test(x.nombre)) {
        var pdf = document.createElement('button');
        pdf.type = 'button';
        pdf.textContent = 'A PDF';
        pdf.onclick = async function (e) {
          e.stopPropagation();
          pdf.disabled = true;
          pdf.textContent = 'Convirtiendo…';
          try {
            var r = await api('/api/documento/pdf', {
              method: 'POST',
              cuerpo: { tipo: 'documentos', f: x.rel },
            });
            avisar('Guardado «' + r.nombre + '» aquí mismo.', 'bien');
            cargar(aqui);
          } catch (err) {
            avisar(err.message, 'malo');
            pdf.disabled = false;
            pdf.textContent = 'A PDF';
          }
        };
        acciones.appendChild(pdf);
      }

      if (acciones.childElementCount) caja.appendChild(acciones);
    }

    return caja;
  }

  function pintarMigas(datos) {
    var m = $('migas');
    m.textContent = '';
    var raiz = document.createElement('a');
    raiz.href = '#';
    raiz.textContent = 'Documentos';
    raiz.dataset.rel = '';
    raiz.onclick = function (e) { e.preventDefault(); cargar(''); };
    m.appendChild(raiz);

    datos.migas.forEach(function (x, i) {
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '/';
      m.appendChild(sep);
      if (i === datos.migas.length - 1) {
        var fin = document.createElement('span');
        fin.className = 'fin';
        fin.textContent = x.nombre;
        m.appendChild(fin);
      } else {
        var a = document.createElement('a');
        a.href = '#';
        a.textContent = x.nombre;
        a.onclick = function (e) { e.preventDefault(); cargar(x.rel); };
        m.appendChild(a);
      }
    });
  }

  /* El boton solo enciende y apaga; lo que se puede hacer con lo marcado sale
     en la barra de abajo, que es de js/seleccion.js. */
  var botonSeleccionar = $('seleccionar');
  if (botonSeleccionar && window.SELECCION) {
    botonSeleccionar.addEventListener('click', function () {
      var encendida = window.SELECCION.activa();
      if (encendida) window.SELECCION.apagar();
      else window.SELECCION.encender();
      botonSeleccionar.setAttribute('aria-pressed', encendida ? 'false' : 'true');
      botonSeleccionar.classList.toggle('activo', !encendida);
    });
  }


  async function cargar(rel) {
    try {
      var d = await api('/api/f/documentos?en=' + encodeURIComponent(rel || ''));
      aqui = d.rel;
      pintarMigas(d);
      var l = $('lista');
      l.textContent = '';
      d.carpetas.forEach(function (x) { l.appendChild(fila(x)); });
      d.ficheros.forEach(function (x) { l.appendChild(fila(x)); });
      $('vacio').hidden = d.total > 0;

    /* Se monta al terminar de pintar: los elementos son nuevos cada vez. */
    if (window.ARRASTRAR) {
      window.ARRASTRAR.montar({
        tipo: 'documentos', contenedor: 'lista', elemento: '.doc',
        carpeta: aqui, horizontal: true,
        recargar: function (bien, mal) {
          if (mal) avisar(mal, 'malo');
          else if (bien) avisar(bien, 'bien');
          cargar(aqui);
        },
      });
      window.ARRASTRAR.montarMigas({
        tipo: 'documentos', migas: 'migas',
        recargar: function (bien, mal) {
          if (mal) avisar(mal, 'malo');
          else if (bien) avisar(bien, 'bien');
          cargar(aqui);
        },
      });

    /* Se monta al terminar de pintar, como el arrastre: las fichas son nuevas
       cada vez y lo marcado tiene que volver a pintarse encima. */
    if (window.SELECCION) {
      window.SELECCION.montar({
        tipo: 'documentos', contenedor: 'lista', elemento: '.doc',
        recargar: function (bien, mal) {
          if (mal) avisar(mal, 'malo');
          else if (bien) avisar(bien, 'bien');
          cargar(aqui);
        },
      });
    }
    }
    } catch (err) { avisar(err.message, 'malo'); }
  }

  // ── Visor ─────────────────────────────────────────────────────────────────

  function cerrar() {
    $('visor').hidden = true;
    $('v-cuerpo').textContent = '';
    document.body.style.overflow = '';
  }
  $('v-cerrar').onclick = cerrar;
  $('v-compartir').onclick = function () {
    if (abierto) Compartir.abrir('documentos', abierto);
  };

  $('v-editar').onclick = function () {
    if (abierto) location.href = '/editar?tipo=documentos&f=' + encodeURIComponent(abierto.rel);
  };

  $('v-pdf').onclick = async function () {
    if (!abierto) return;
    avisar('Convirtiendo… puede tardar unos segundos.', '');
    try {
      var r = await api('/api/documento/pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo: 'documentos', f: abierto.rel }),
      });
      avisar('Listo: ' + r.nombre, 'bueno');
      cerrar();
      cargar(aqui);
    } catch (err) { avisar(err.message, 'malo'); }
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('visor').hidden) cerrar();
  });

  function papel() {
    var d = document.createElement('div');
    d.className = 'hoja-papel';
    return d;
  }

  var abierto = null;

  async function abrir(x) {
    abierto = x;
    $('v-nombre').textContent = x.nombre;
    $('v-descargar').href = verUrl(x.rel, true);
    $('visor').hidden = false;
    document.body.style.overflow = 'hidden';

    var c = $('v-cuerpo');
    c.textContent = 'Abriendo…';

    var d;
    try { d = await api('/api/documentos/abrir?f=' + encodeURIComponent(x.rel)); }
    catch (err) { c.textContent = ''; c.appendChild(sinVisor(err.message, x)); return; }

    c.textContent = '';

    if (d.clase === 'pdf') {
      var marco = document.createElement('iframe');
      marco.src = verUrl(x.rel);
      marco.title = x.nombre;
      c.appendChild(marco);

    } else if (d.clase === 'imagen') {
      var img = document.createElement('img');
      img.src = verUrl(x.rel);
      img.alt = x.nombre;
      c.appendChild(img);

    } else if (d.clase === 'texto') {
      var h = papel();
      var pre = document.createElement('pre');
      pre.textContent = d.texto;
      h.appendChild(pre);
      c.appendChild(h);

    } else if (d.clase === 'documento') {
      var hoja = papel();
      d.parrafos.forEach(function (p) {
        if (!p.texto) return;
        var el = document.createElement(p.titulo ? 'h' + Math.min(3, p.titulo + 1) : (p.lista ? 'li' : 'p'));
        el.textContent = p.texto;
        hoja.appendChild(el);
      });
      if (!hoja.children.length) hoja.appendChild(document.createTextNode('El documento está vacío.'));
      c.appendChild(hoja);

    } else if (d.clase === 'hoja') {
      var cont = papel();
      d.hojas.forEach(function (h) {
        var t = document.createElement('div');
        t.className = 'nombre-hoja';
        t.textContent = h.nombre;
        cont.appendChild(t);

        if (!h.filas.length) {
          var v = document.createElement('p');
          v.textContent = 'Hoja vacía.';
          cont.appendChild(v);
          return;
        }
        var caja = document.createElement('div');
        caja.className = 'tabla-caja';
        var tabla = document.createElement('table');
        /* La primera fila hace de cabecera. Es una suposición, pero acierta
           casi siempre y hace la tabla mucho más legible. */
        var thead = document.createElement('thead');
        var trh = document.createElement('tr');
        h.filas[0].forEach(function (celda) {
          var th = document.createElement('th');
          th.textContent = celda.valor;
          trh.appendChild(th);
        });
        thead.appendChild(trh);
        tabla.appendChild(thead);

        var tbody = document.createElement('tbody');
        h.filas.slice(1).forEach(function (f) {
          var tr = document.createElement('tr');
          f.forEach(function (celda) {
            var td = document.createElement('td');
            td.textContent = celda.valor;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        tabla.appendChild(tbody);
        caja.appendChild(tabla);
        cont.appendChild(caja);
      });
      c.appendChild(cont);

    } else if (d.clase === 'laminas') {
      d.laminas.forEach(function (l) {
        var el = document.createElement('div');
        el.className = 'lamina';
        var n = document.createElement('div');
        n.className = 'lamina-num';
        n.textContent = 'Diapositiva ' + l.numero;
        el.appendChild(n);
        l.lineas.forEach(function (t) {
          var p = document.createElement('p');
          p.textContent = t;
          el.appendChild(p);
        });
        c.appendChild(el);
      });

    } else {
      c.appendChild(sinVisor(d.aviso || 'No hay visor para esto.', x));
    }
  }

  function sinVisor(mensaje, x) {
    var d = document.createElement('div');
    d.className = 'sin-visor';
    var p = document.createElement('p');
    p.textContent = mensaje;
    var a = document.createElement('a');
    a.className = 'boton principal';
    a.href = verUrl(x.rel, true);
    a.download = '';
    a.textContent = 'Descargar ' + x.nombre;
    d.appendChild(p);
    d.appendChild(a);
    return d;
  }

  /*
   * Crear de cero, aquí y no solo en Archivos.
   *
   * Estaban únicamente en Archivos, que es donde acaban los ficheros sueltos.
   * Pero el sitio donde uno va a crear un documento es Documentos: buscarlo en
   * la otra pantalla es justo lo que no se le ocurre a nadie.
   */
  async function crearDocumento(clase, frase) {
    var nombre = prompt('Nombre ' + frase + ':');
    if (!nombre) return;
    try {
      var r = await api('/api/documento/nuevo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clase: clase, tipo: 'documentos', en: aqui, nombre: nombre }),
      });
      location.href = '/editar?tipo=documentos&f=' + encodeURIComponent(r.rel);
    } catch (err) { avisar(err.message, 'malo'); }
  }

  /* El menú se abre al pulsar y se cierra al elegir, al pulsar fuera o con
     Escape, que es lo que espera cualquiera de un desplegable. */
  var FRASES = {
    documento: 'del documento nuevo',
    hoja: 'de la hoja de cálculo nueva',
    presentacion: 'de la presentación nueva',
    texto: 'del documento de texto nuevo',
  };

  function verMenu(abierto) {
    $('menu-nuevo').hidden = !abierto;
    $('nuevo').setAttribute('aria-expanded', String(abierto));
  }

  $('nuevo').onclick = function (e) {
    e.stopPropagation();
    verMenu($('menu-nuevo').hidden);
  };

  $('menu-nuevo').onclick = function (e) {
    var b = e.target.closest('button[data-clase]');
    if (!b) return;
    verMenu(false);
    crearDocumento(b.dataset.clase, FRASES[b.dataset.clase] || 'del fichero nuevo');
  };

  document.addEventListener('click', function () { verMenu(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') verMenu(false);
  });

  $('nueva').onclick = async function () {
    var nombre = prompt('Nombre de la carpeta nueva:');
    if (!nombre) return;
    try {
      await api('/api/f/documentos/carpeta', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ en: aqui, nombre: nombre }),
      });
      cargar(aqui);
    } catch (err) { avisar(err.message, 'malo'); }
  };

  /* Editar también desde la fila: abrir el visor para luego pulsar editar son
     dos pasos donde basta uno. */
  var EDITABLE = /\.(txt|md|csv|log|json|xml|ya?ml|ini|conf|docx|xlsx|odt|ods)$/i;

  cargar('');
})();
</script>
